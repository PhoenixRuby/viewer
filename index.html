    // 搜尋：找出所有符合的節點，以及它們的祖先（祖先要展開）
    const collect = () => {
      const keep = new Set(), anc = new Set();
      let n = 0;
      const walk = (val, p) => {
        let hit = false;
        const t = jsonType(val);
        if (t === 'object' || t === 'array') {
          const keys = t === 'array' ? val.map((_, i) => i) : Object.keys(val);
          for (const k of keys) {
            const cp = p.concat([k]);
            const kh = typeof k === 'string' && k.toLowerCase().includes(qs);
            const ch = walk(val[k], cp);
            if (kh || ch) { keep.add(pk(cp)); hit = true; if (kh && !ch && n < 5000) n++; }
          }
          if (hit) anc.add(pk(p));
        } else if (String(val).toLowerCase().includes(qs)) { if (n < 5000) n++; return true; }
        return hit;
      };
      walk(data, []);
      keep.add(pk([]));
      return { keep, anc, n };
    };

    const nodeEl = (key, val, p, depth, ctx) => {
      const t = jsonType(val), isC = t === 'object' || t === 'array';
      const box = elx('div', 'jn');
      const head = elx('div', 'jh');
      head._p = p;
      head._v = val;
      const arrow = elx('span', 'ja', isC ? '▸' : '');
      head.append(arrow);
      if (key !== null) {
        const ks = elx('span', typeof key === 'number' ? 'jkey jidx' : 'jkey');
        ks.innerHTML = typeof key === 'number' ? '[' + key + ']' : hi(key);
        head.append(ks, elx('span', 'jc', ': '));
      }
      if (isC) {
        const n = t === 'array' ? val.length : Object.keys(val).length;
        head.append(elx('span', 'jsum', (t === 'array' ? '[' : '{') + n + (t === 'array' ? ']' : '}')));
        const kids = elx('div', 'jk');
        kids.hidden = true;
        box.append(head, kids);
        let filled = false;
        const open = o => {
          if (o && !filled) { filled = true; fillKids(kids, val, p, depth, ctx); }
          kids.hidden = !o;
          arrow.textContent = o ? '▾' : '▸';
        };
        head._toggle = () => open(kids.hidden);
        open(ctx.anc ? ctx.anc.has(pk(p)) : depth < st.depth);
      } else {
        const sv = elx('span', 'jv jv-' + t);
        const text = t === 'string' ? '"' + (val.length > 500 ? val.slice(0, 500) + '…' : val) + '"' : String(val);
        sv.innerHTML = hi(text);
        if (t === 'string' && val.length > 60) head.title = val.length > 1000 ? val.slice(0, 1000) + '…' : val;
        head.append(sv);
        box.append(head);
      }
      return box;
    };
    const fillKids = (kids, val, p, depth, ctx) => {
      const keys = Array.isArray(val) ? val.map((_, i) => i) : Object.keys(val);
      const list = ctx.keep ? keys.filter(k => ctx.keep.has(pk(p.concat([k])))) : keys;
      const add = from => {
        const end = Math.min(list.length, from + 200);
        for (let i = from; i < end; i++) kids.append(nodeEl(list[i], val[list[i]], p.concat([list[i]]), depth + 1, ctx));
        if (end < list.length) {
          const more = elx('div', 'jmore', '顯示更多（還有 ' + (list.length - end) + ' 項）');
          more.addEventListener('click', e => { e.stopPropagation(); more.remove(); add(end); });
          kids.append(more);
        }
      };
      add(0);
    };

    const build = () => {
      tree.textContent = '';
      qs = st.q.trim().toLowerCase();
      let ctx = { keep: null, anc: null };
      if (qs) { const c = collect(); ctx = { keep: c.keep, anc: c.anc }; stat.textContent = c.n ? '找到約 ' + c.n + ' 處符合' : '沒有符合的節點'; }
      else stat.textContent = '';
      tree.append(nodeEl(null, data, [], 0, ctx));
      selected = null;
      selPath.textContent = '點一下節點可複製路徑或值';
      [cpPath, cpJq, cpVal].forEach(b => { b.disabled = true; });
    };
    const countNodes = (v, lim) => {
      let n = 0;
      const st2 = [v];
      while (st2.length && n <= lim) {
        const x = st2.pop(); n++;
        if (x && typeof x === 'object') for (const k in x) st2.push(x[k]);
      }
      return n;
    };
    const setDepth = d => {
      if (d === Infinity && countNodes(data, 20000) > 20000) { d = 4; notify('節點太多，只展開到第 4 層（可以再逐層展開）。'); }
      st.depth = d;
      build();
    };

    tree.addEventListener('click', e => {
      const more = e.target.closest('.jmore');
      if (more) return;
      const head = e.target.closest('.jh');
      if (!head) return;
      if (selected) selected.classList.remove('sel');
      selected = head;
      head.classList.add('sel');
      selPath.textContent = head._p.length ? jsonPath(head._p) : '（根）';
      [cpPath, cpJq, cpVal].forEach(b => { b.disabled = false; });
      if (head._toggle) head._toggle();
    });
    let timer = null;
    q.addEventListener('input', () => { clearTimeout(timer); timer = setTimeout(() => { st.q = q.value; build(); }, 220); });

    viewer.textContent = '';
    viewer.append(root);
    viewer.scrollTop = 0;
    viewer.scrollLeft = 0;
    metaText.textContent = 'JSON · 樹狀 · ' + fmtSize(info.size);
    build();
    return true;
  }
  VIEW_KINDS.json = { label: '樹狀', title: '切換成樹狀檢視（可摺疊、搜尋、複製路徑）', detect: (info, p) => info.lang === 'json' && info.text.length > 1, render: renderJsonTree };

  /* ---------- 圖片 / PDF / SVG ---------- */
  // 圖片檢視：滾輪以游標位置為中心縮放、拖曳平移、雙擊切換 100% / 適合視窗；鍵盤 + - 0 1 與方向鍵
  function imageStage(url, name) {
    const root = elx('div', 'media');
    const bar = elx('div', 'mbar');
    const mkb = (label, title, fn) => { const b = elx('button', 'btn', label); b.type = 'button'; b.title = title; b.addEventListener('click', fn); return b; };
    const zoomLabel = elx('span', 'mzoom');
    const dims = elx('span', 'nb-muted');
    const stage = elx('div', 'mstage');
    stage.tabIndex = 0;
    const img = elx('img');
    img.alt = name;
    img.draggable = false;
    stage.append(img);

    const st = { s: 1, x: 0, y: 0, fit: true, nw: 0, nh: 0 };
    const MIN = 0.02, MAX = 40;
    const box = () => { const r = stage.getBoundingClientRect(); return { w: r.width || stage.clientWidth || 0, h: r.height || stage.clientHeight || 0, l: r.left || 0, t: r.top || 0 }; };
    const apply = () => {
      img.style.transform = 'translate(' + st.x + 'px,' + st.y + 'px) scale(' + st.s + ')';
      zoomLabel.textContent = Math.round(st.s * 100) + '%' + (st.fit ? '（適合視窗）' : '');
      stage.classList.toggle('pix', st.s >= 3);   // 放得很大時用方塊像素，才看得清楚每個點
    };
    const fit = () => {
      const b = box();
      st.fit = true;
      st.s = st.nw && b.w ? Math.min(1, b.w / st.nw, b.h / st.nh) : 1;   // 大圖縮到放得下；小圖不放大
      st.x = (b.w - st.nw * st.s) / 2;
      st.y = (b.h - st.nh * st.s) / 2;
      apply();
    };
    // 以舞台座標 (px,py) 為中心縮放：這一點底下的圖片內容不會跑掉
    const zoomAt = (factor, px, py) => {
      const ns = Math.min(MAX, Math.max(MIN, st.s * factor));
      const k = ns / st.s;
      st.x = px - (px - st.x) * k;
      st.y = py - (py - st.y) * k;
      st.s = ns;
      st.fit = false;
      apply();
    };
    const zoomCenter = factor => { const b = box(); zoomAt(factor, b.w / 2, b.h / 2); };
    const actual = (px, py) => zoomAt(1 / st.s, px, py);

    bar.append(
      mkb('－', '縮小', () => zoomCenter(1 / 1.25)), mkb('＋', '放大', () => zoomCenter(1.25)),
      mkb('適合視窗', '縮放到剛好放得進視窗（快速鍵 0）', fit),
      mkb('100%', '原始大小（快速鍵 1）', () => { const b = box(); actual(b.w / 2, b.h / 2); }),
      zoomLabel, dims, elx('span', 'nb-muted mhint', '滾輪縮放 · 拖曳平移 · 雙擊切換'));

    stage.addEventListener('wheel', e => {
      e.preventDefault();
      const b = box();
      const dy = e.deltaMode === 1 ? e.deltaY * 33 : e.deltaY;   // 有些瀏覽器的滾輪單位是「行」
      zoomAt(Math.exp(-dy * (e.ctrlKey ? 0.01 : 0.0015)), e.clientX - b.l, e.clientY - b.t);
    }, { passive: false });

    let drag = null;
    stage.addEventListener('pointerdown', e => {
      if (e.button !== 0) return;
      drag = { x: e.clientX, y: e.clientY, ox: st.x, oy: st.y };
      stage.classList.add('drag');
      try { stage.setPointerCapture(e.pointerId); } catch (_) {}
      stage.focus({ preventScroll: true });
    });
    stage.addEventListener('pointermove', e => {
      if (!drag) return;
      st.x = drag.ox + e.clientX - drag.x;
      st.y = drag.oy + e.clientY - drag.y;
      apply();
    });
    const endDrag = () => { drag = null; stage.classList.remove('drag'); };
    stage.addEventListener('pointerup', endDrag);
    stage.addEventListener('pointercancel', endDrag);
    stage.addEventListener('dblclick', e => {
      const b = box();
      if (Math.abs(st.s - 1) < 0.01) fit(); else actual(e.clientX - b.l, e.clientY - b.t);
    });
    stage.addEventListener('keydown', e => {
      if (e.ctrlKey || e.metaKey || e.altKey) return;
      const pan = (dx, dy) => { st.x += dx; st.y += dy; apply(); };
      switch (e.key) {
        case '+': case '=': e.preventDefault(); zoomCenter(1.25); break;
        case '-': case '_': e.preventDefault(); zoomCenter(1 / 1.25); break;
        case '0': e.preventDefault(); fit(); break;
        case '1': { e.preventDefault(); const b = box(); actual(b.w / 2, b.h / 2); break; }
        case 'ArrowLeft': e.preventDefault(); pan(60, 0); break;
        case 'ArrowRight': e.preventDefault(); pan(-60, 0); break;
        case 'ArrowUp': e.preventDefault(); pan(0, 60); break;
        case 'ArrowDown': e.preventDefault(); pan(0, -60); break;
      }
    });
    img.addEventListener('load', () => {
      st.nw = img.naturalWidth;
      st.nh = img.naturalHeight;
      dims.textContent = st.nw + ' × ' + st.nh + ' px';
      fit();
    });
    img.addEventListener('error', () => { dims.textContent = '無法顯示這張圖片（檔案可能已損毀）'; });
    if (typeof ResizeObserver !== 'undefined') new ResizeObserver(() => { if (st.fit) fit(); }).observe(stage);   // 視窗大小改變時，「適合視窗」要跟著重算
    img.src = url;

    root.append(bar, stage);
    viewer.textContent = '';
    viewer.append(root);
    // 注意：這裡不能自動 stage.focus()——使用者用方向鍵逛目錄時，每走到一張圖片焦點就會被搶走。只在使用者點擊圖片時才取得焦點（pointerdown）
  }

  /* ===================== 影音播放器 ===================== */
  // 設計原則：絕不自動播放、絕不自動取得焦點（用方向鍵逛目錄時不能被搶走）。只有「正在播放」的東西被切走時才會詢問。
  const safeParse = s => { try { return JSON.parse(s || '{}') || {}; } catch (_) { return {}; } };
  const mediaPrefs = Object.assign({ vol: 1, muted: false, rate: 1, pitch: true, loop: false, pinFs: false, sub: true, subSize: 1, subPos: 8, subColor: '#ffffff', subBg: 'dim' }, safeParse(lsGet('viewer-media-prefs')));
  const saveMediaPrefs = () => lsSet('viewer-media-prefs', JSON.stringify(mediaPrefs));
  state.player = null;        // 預覽區目前這個檔案的播放器
  state.bg = null;            // 縮成迷你播放器、在背景播放的那一個（同時最多一個）
  state.autoplayPath = null;  // 使用者按了「上一首 / 下一首」：這個檔案開啟後直接播放
  const miniEl = $('mini');
  const mediaHost = $('mediaHost');   // 在背景播放的 <audio> 放在這裡（元素離開文件會被瀏覽器暫停，所以要有個地方安放）

  const fmtTime = s => {
    if (!isFinite(s) || s < 0) s = 0;
    const h = Math.floor(s / 3600), m = Math.floor((s % 3600) / 60), sec = Math.floor(s % 60);
    return (h ? h + ':' + String(m).padStart(2, '0') : String(m)) + ':' + String(sec).padStart(2, '0');
  };
  const isPlaying = P => !!P && !P.destroyed && !P.media.paused && !P.media.ended;

  /* ---------- 記住每個檔案播到哪裡 ---------- */
  const posKey = path => (state.root ? groupKey() : '') + '\u0001' + path;
  function savePos(P) {
    const t = P.media.currentTime, d = P.media.duration;
    const m = safeParse(lsGet('viewer-media-pos'));
    if (!isFinite(t) || !isFinite(d) || t < 5 || t > d - 5) delete m[posKey(P.path)];
    else m[posKey(P.path)] = { t, at: Date.now() };
    const keys = Object.keys(m);
    if (keys.length > 150) keys.sort((a, b) => m[a].at - m[b].at).slice(0, keys.length - 150).forEach(k => delete m[k]);
    lsSet('viewer-media-pos', JSON.stringify(m));
  }
  const savedPos = path => { const e = safeParse(lsGet('viewer-media-pos'))[posKey(path)]; return e && isFinite(e.t) ? e.t : 0; };

  const siblingMedia = path => {
    const dir = path.includes('/') ? path.slice(0, path.lastIndexOf('/') + 1) : '';
    return [...state.files.keys()].filter(p => p.startsWith(dir) && !p.slice(dir.length).includes('/') && (MEDIA_EXT[extOf(p)] === 'audio' || MEDIA_EXT[extOf(p)] === 'video'))
      .sort((a, b) => a.localeCompare(b, undefined, { numeric: true, sensitivity: 'base' }));
  };

  async function saveBlobAs(name, blob) {
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = name;
    document.body.append(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 3000);
  }

  /* ---------- 建立 / 銷毀 ---------- */
  function createPlayer(path, file, kind) {
    const ext = extOf(path);
    const media = document.createElement(kind === 'video' ? 'video' : 'audio');
    media.className = 'pv-media';
    media.preload = 'metadata';
    media.controls = false;
    media.playsInline = true;
    media.volume = Math.min(1, Math.max(0, mediaPrefs.vol));
    media.muted = !!mediaPrefs.muted;
    media.playbackRate = mediaPrefs.rate;
    for (const k of ['preservesPitch', 'mozPreservesPitch', 'webkitPreservesPitch']) { try { if (k in media) media[k] = !!mediaPrefs.pitch; } catch (_) {} }
    media.loop = !!mediaPrefs.loop;
    const P = {
      path, file, kind, ext, media, mode: 'none', url: null, ac: null, destroyed: false, asked: false,
      sniff: null, verdict: null, error: null, hasVideo: kind === 'video', coverUrl: null,
      vt: { flipH: false, flipV: false, rot: 0 }, ab: { a: null, b: null }, subs: { cands: [], cur: null, cues: [], enc: '', guessed: false, forced: '', delay: 0, text: '' },
      ui: null, lastSave: 0
    };
    // 與畫面無關、整個播放期間都要有的監聽
    const m = media;
    m.addEventListener('play', () => { if (state.bg && state.bg !== P) destroyPlayer(state.bg); setupMediaSession(P); });
    m.addEventListener('pause', () => savePos(P));
    m.addEventListener('ended', () => { savePos(P); if (P.mode === 'mini') setTimeout(() => { if (!P.destroyed && P.mode === 'mini' && m.ended) destroyPlayer(P); }, 4000); });
    let abRaf = 0;
    const abLoop = () => { abRaf = 0; if (P.destroyed || m.paused) return; if (P.ab.a != null && P.ab.b != null && m.currentTime >= P.ab.b) m.currentTime = P.ab.a; abRaf = requestAnimationFrame(abLoop); };
    m.addEventListener('play', () => { if (!abRaf) abRaf = requestAnimationFrame(abLoop); });
    m.addEventListener('timeupdate', () => {
      if (P.ab.a != null && P.ab.b != null && m.currentTime >= P.ab.b) m.currentTime = P.ab.a;
      const now = Date.now();
      if (now - P.lastSave > 4000) { P.lastSave = now; savePos(P); }
    });
    m.addEventListener('volumechange', () => { mediaPrefs.vol = m.volume; mediaPrefs.muted = m.muted; saveMediaPrefs(); });
    m.addEventListener('ratechange', () => { mediaPrefs.rate = m.playbackRate; saveMediaPrefs(); });
    m.addEventListener('error', () => { P.error = { code: m.error ? m.error.code : 4 }; if (P.ui) P.ui.refresh(); });
    m.addEventListener('loadedmetadata', () => {
      if (P.restored) return;
      P.restored = true;
      const t = savedPos(P.path);
      if (t > 5 && isFinite(m.duration) && t < m.duration - 5) { m.currentTime = t; notify('從上次播放到的 ' + fmtTime(t) + ' 繼續（按 Home 可以從頭開始）。'); }
      if (P.ui) P.ui.refresh();
    });
    P.ready = startPlayer(P);
    return P;
  }

  async function startPlayer(P) {
    const file = P.file, size = file.size;
    const read = (a, b) => file.slice(a, b).arrayBuffer().then(x => new Uint8Array(x));
    try { P.sniff = await sniffMedia(read, size, P.ext); }
    catch (_) { P.sniff = { container: '', video: [], audio: [], subs: [], notes: ['標頭解析失敗'], tags: null, duration: null, kind: P.kind }; }
    if (P.destroyed) return;
    P.verdict = mediaVerdict(P.sniff, t => P.media.canPlayType(t));
    P.hasVideo = P.kind === 'video' && (P.sniff.video.length > 0 || !P.sniff.container);   // 看不出內容時，保守當成有影像
    if (P.sniff.tags && P.sniff.tags.cover) {
      const c = P.sniff.tags.cover;
      P.coverUrl = URL.createObjectURL(new Blob([c.data], { type: c.mime }));
    }
    P.url = URL.createObjectURL(file.slice(0, size, mediaBlobMime(P.ext, P.sniff)));
    P.media.src = P.url;
    P.subs.cands = P.hasVideo ? subtitleCandidates([...state.files.keys()], P.path) : [];
    if (P.ui) P.ui.refresh();
    if (P.subs.cands.length && mediaPrefs.sub) await loadSubtitle(P, P.subs.cands[0]);
    if (P.destroyed) return;
    if (state.autoplayPath === P.path) { state.autoplayPath = null; P.media.play().catch(() => {}); }
  }

  function destroyPlayer(P) {
    if (!P || P.destroyed) return;
    P.destroyed = true;
    unmountUi(P);
    const m = P.media;
    try { m.pause(); m.removeAttribute('src'); m.load(); } catch (_) {}
    m.remove();
    if (P.url) URL.revokeObjectURL(P.url);
    if (P.coverUrl) URL.revokeObjectURL(P.coverUrl);
    if (state.player === P) state.player = null;
    if (state.bg === P) { state.bg = null; miniEl.hidden = true; miniEl.textContent = ''; }
    try { if (navigator.mediaSession) navigator.mediaSession.playbackState = 'none'; } catch (_) {}
  }
  function destroyAllPlayers() { destroyPlayer(state.player); destroyPlayer(state.bg); }

  function unmountUi(P) {
    if (P.ac) { P.ac.abort(); P.ac = null; }
    if (P.ui && P.ui.root && P.ui.root.parentNode) P.ui.root.remove();
    P.ui = null;
  }

  function setupMediaSession(P) {
    if (!('mediaSession' in navigator) || typeof MediaMetadata === 'undefined') return;
    try {
      const t = (P.sniff && P.sniff.tags) || {};
      navigator.mediaSession.metadata = new MediaMetadata({ title: t.title || base(P.path), artist: t.artist || '', album: t.album || '', artwork: P.coverUrl ? [{ src: P.coverUrl }] : [] });
      const m = P.media, ms = navigator.mediaSession;
      ms.setActionHandler('play', () => m.play());
      ms.setActionHandler('pause', () => m.pause());
      ms.setActionHandler('seekbackward', d => { m.currentTime = Math.max(0, m.currentTime - ((d && d.seekOffset) || 10)); });
      ms.setActionHandler('seekforward', d => { m.currentTime = Math.min(m.duration || 0, m.currentTime + ((d && d.seekOffset) || 10)); });
      ms.setActionHandler('seekto', d => { if (d && isFinite(d.seekTime)) m.currentTime = d.seekTime; });
      ms.setActionHandler('previoustrack', P.mode === 'full' ? () => stepTrack(P, -1) : null);
      ms.setActionHandler('nexttrack', P.mode === 'full' ? () => stepTrack(P, 1) : null);
    } catch (_) {}
  }

  function stepTrack(P, dir) {
    const list = siblingMedia(P.path);
    const i = list.indexOf(P.path);
    const next = list[i + dir];
    if (!next) { notify(dir > 0 ? '這已經是資料夾裡的最後一個影音檔。' : '這已經是資料夾裡的第一個影音檔。'); return; }
    state.autoplayPath = next;   // 使用者主動按「下一首」，所以開啟後直接播放
    previewFile(next);
  }

  /* ---------- 字幕 ---------- */
  async function loadSubtitle(P, cand, forcedEnc) {
    try {
      const file = cand.file || state.files.get(cand.path);
      if (!file) return;
      const bytes = new Uint8Array(await file.arrayBuffer());
      const d = decodeSubtitle(bytes, cand.tag || '', forcedEnc || '');
      const cues = parseSubtitle(d.text, cand.ext);
      if (P.destroyed) return;
      P.subs.cur = cand; P.subs.cues = cues; P.subs.enc = d.encoding; P.subs.guessed = d.guessed; P.subs.forced = forcedEnc || '';
      P.subs.error = cues.length ? '' : '這個字幕檔裡沒有讀到任何字幕（格式不對，或編碼選錯了）';
    } catch (err) {
      P.subs.cur = cand; P.subs.cues = []; P.subs.error = '字幕檔讀取失敗：' + ((err && err.message) || err);
    }
    if (P.ui) P.ui.refreshSubs();
  }

  /* ---------- 完整播放器（預覽區） ---------- */
  function mountFull(P) {
    // 先把 <video>/<audio> 搬到新畫面裡，再換掉預覽區：搬動是同一個工作階段內的「移除＋插入」，瀏覽器不會因此暫停播放
    unmountUi(P);
    if (P.mode === 'mini') { miniEl.hidden = true; miniEl.textContent = ''; }   // 只有「這個播放器自己」從迷你播放器回來時才清；打開別的影音檔不能動到背景那首的迷你播放器
    P.mode = 'full';
    const ac = new AbortController();
    P.ac = ac;
    const sig = { signal: ac.signal };
    const on = (el, type, fn) => el.addEventListener(type, fn, sig);
    const m = P.media;

    const root = elx('div', 'pv');
    root.tabIndex = 0;
    const stage = elx('div', 'pv-stage');
    const art = elx('div', 'pv-art');
    const sub = elx('div', 'pv-sub');
    const msg = elx('div', 'pv-msg');
    msg.hidden = true;
    stage.append(m, art, sub, msg);
    const bar = elx('div', 'pv-bar');
    const info = elx('div', 'pv-info');
    const panel = elx('div', 'pv-panel');
    panel.hidden = true;
    const ctl = elx('div', 'pv-ctl');   // 控制面板整組：一般模式在畫面下方；全螢幕時浮在畫面上
    ctl.append(bar, info, panel);
    root.append(stage, ctl);

    const btn = (label, title, fn) => { const b = elx('button', 'btn', label); b.type = 'button'; b.title = title; on(b, 'click', fn); return b; };
    const play = btn('▶', '播放 / 暫停（空白鍵 或 K）', () => togglePlay());
    play.classList.add('pv-play');
    const prev = btn('⏮', '上一個影音檔', () => stepTrack(P, -1)), next = btn('⏭', '下一個影音檔', () => stepTrack(P, 1));
    const time = elx('span', 'pv-time', '0:00 / 0:00');
    const seek = elx('input', 'pv-seek'); seek.type = 'range'; seek.min = '0'; seek.max = '1000'; seek.value = '0'; seek.title = '播放位置';
    const mute = btn('音量', '靜音（M）', () => { m.muted = !m.muted; });
    const vol = elx('input', 'pv-vol'); vol.type = 'range'; vol.min = '0'; vol.max = '100'; vol.value = String(Math.round(m.volume * 100)); vol.title = '音量';
    const rate = elx('select', 'nb-sel pv-rate'); rate.title = '播放速度（[ 與 ] 可以微調）';
    [0.25, 0.5, 0.75, 1, 1.25, 1.5, 1.75, 2, 3, 4].forEach(r => { const o = elx('option', '', r + '×'); o.value = String(r); rate.append(o); });
    const pitchL = elx('label', 'pv-pitch'); const pitch = elx('input'); pitch.type = 'checkbox'; pitch.checked = !!mediaPrefs.pitch; pitchL.append(pitch, document.createTextNode(' 變速不變調')); pitchL.title = '變速時保持原本的音高';
    const loop = btn('循環', '重複播放（L）', () => { m.loop = !m.loop; mediaPrefs.loop = m.loop; saveMediaPrefs(); paint(); });
    const ab = btn('A–B', '區間重複：第一次按設定起點 A，第二次設定終點 B，第三次清除', () => {
      if (P.ab.a == null) P.ab.a = m.currentTime;
      else if (P.ab.b == null) { if (m.currentTime > P.ab.a + 0.5) { P.ab.b = m.currentTime; m.currentTime = P.ab.a; } }
      else { P.ab.a = null; P.ab.b = null; }
      paint();
    });
    const flipH = btn('水平翻轉', '左右鏡像（H）', () => { P.vt.flipH = !P.vt.flipH; applyVt(); paint(); });
    const flipV = btn('垂直翻轉', '上下顛倒（V）', () => { P.vt.flipV = !P.vt.flipV; applyVt(); paint(); });
    const rot = btn('旋轉 90°', '順時針旋轉 90 度（R）', () => { P.vt.rot = (P.vt.rot + 90) % 360; applyVt(); paint(); });
    const vtReset = btn('還原畫面', '取消翻轉與旋轉', () => { P.vt = { flipH: false, flipV: false, rot: 0 }; applyVt(); paint(); });
    const cc = btn('字幕', '字幕設定（C 開關）', () => { panel.hidden = !panel.hidden; paint(); });
    const pip = btn('子母畫面', '用小視窗浮在最上層（注意：子母畫面不會套用翻轉與旋轉）', async () => { try { if (document.pictureInPictureElement) await document.exitPictureInPicture(); else await m.requestPictureInPicture(); } catch (e) { notify('無法開啟子母畫面：' + ((e && e.message) || e), true); } });
    const shot = btn('截圖', '把目前的畫面存成 PNG', () => {
      if (!m.videoWidth) { notify('目前沒有可以截圖的畫面。'); return; }
      const cv = document.createElement('canvas'); cv.width = m.videoWidth; cv.height = m.videoHeight;
      const g = cv.getContext && cv.getContext('2d');
      if (!g) { notify('這個瀏覽器無法截圖。', true); return; }
      try { g.drawImage(m, 0, 0); } catch (e) { notify('截圖失敗：' + ((e && e.message) || e), true); return; }
      cv.toBlob(b => { if (b) saveBlobAs(base(P.path).replace(/\.[^.]+$/, '') + '_' + fmtTime(m.currentTime).replace(':', '-') + '.png', b); }, 'image/png');
    });
    const fs = btn('全螢幕', '全螢幕（F）', () => toggleFs());
    const pinBtn = btn('釘選面板', '全螢幕時讓控制面板固定顯示（不自動隱藏）', () => { mediaPrefs.pinFs = !mediaPrefs.pinFs; saveMediaPrefs(); paint(); wake(); });
    const row1 = elx('div', 'pv-row'), row2 = elx('div', 'pv-row');
    row1.append(prev, play, next, time, seek, mute, vol);
    row2.append(rate, pitchL, loop, ab, flipH, flipV, rot, vtReset, cc, pip, shot, fs, pinBtn);
    bar.append(row1, row2);

    /* --- 控制 --- */
    const togglePlay = () => { if (m.paused || m.ended) m.play().catch(e => notify('無法播放：' + ((e && e.message) || e), true)); else m.pause(); };
    const isFs = () => document.fullscreenElement === root || document.webkitFullscreenElement === root;
    const toggleFs = () => {
      if (isFs()) { const x = document.exitFullscreen || document.webkitExitFullscreen; if (x) Promise.resolve(x.call(document)).catch(() => {}); }
      else { const f = root.requestFullscreen || root.webkitRequestFullscreen; if (f) Promise.resolve(f.call(root)).catch(() => {}); }
    };
    // 全螢幕時的控制面板：滑鼠移動 / 按鍵 / 觸控就出現，靜止 2.5 秒後隱藏（滑鼠停在面板上、或已釘選則不隱藏）
    let idleT = 0, over = false;   // over：滑鼠是否停在面板上（自己追蹤，不靠 :hover，觸控裝置也一致）
    const wake = () => {
      root.classList.remove('idle');
      clearTimeout(idleT);
      if (!isFs() || mediaPrefs.pinFs) return;
      idleT = setTimeout(() => { if (over) wake(); else root.classList.add('idle'); }, 2500);
    };
    on(ctl, 'mouseenter', () => { over = true; });
    on(ctl, 'mouseleave', () => { over = false; wake(); });
    const syncFs = () => { root.classList.toggle('fs', isFs()); wake(); paint(); applyVt(); paintSub(); };
    const seekBy = d => { m.currentTime = Math.max(0, Math.min(isFinite(m.duration) ? m.duration : Infinity, m.currentTime + d)); };
    const applyVt = () => {
      const w = stage.clientWidth || 1, h = stage.clientHeight || 1;
      const quarter = P.vt.rot % 180 !== 0;
      const s = quarter ? Math.min(w / h, h / w) : 1;   // 轉 90° 後要縮小，才放得進原本的視窗
      m.style.transform = P.vt.flipH || P.vt.flipV || P.vt.rot ? 'scale(' + (P.vt.flipH ? -s : s) + ',' + (P.vt.flipV ? -s : s) + ') rotate(' + P.vt.rot + 'deg)' : '';
    };

    /* --- 字幕畫面 --- */
    const subColors = [['#ffffff', '白'], ['#ffe14d', '黃'], ['#7fe9ff', '青']];
    let subKey = '';   // 目前畫在畫面上的內容與設定；沒變就不重建（逐格檢查時每秒會呼叫 60 次）
    const paintSub = () => {
      if (!mediaPrefs.sub || !P.subs.cur || !P.hasVideo) { if (subKey !== '') { sub.textContent = ''; subKey = ''; } return; }
      const t = m.currentTime - P.subs.delay;
      const active = cuesAt(P.subs.cues, t);
      const px = Math.max(12, Math.min(64, (stage.clientHeight || 300) * 0.045 * mediaPrefs.subSize));
      const key = active.map(c => c.start + '|' + c.text).join('\n') + '~' + [px, mediaPrefs.subPos, mediaPrefs.subColor, mediaPrefs.subBg].join('~');
      if (key === subKey) return;
      subKey = key;
      sub.textContent = '';
      sub.style.fontSize = px + 'px';
      sub.style.bottom = mediaPrefs.subPos + '%';
      for (const c of active) {
        for (const line of c.text.split('\n')) {
          const row = elx('div', 'pv-line');
          const span = elx('span', 'pv-sp');
          span.style.color = mediaPrefs.subColor;
          if (mediaPrefs.subBg !== 'none') span.style.background = mediaPrefs.subBg === 'solid' ? '#000' : 'rgba(0,0,0,.6)';
          for (const r of subtitleRuns(line)) {
            const e = elx('span', '', r.text);   // textContent：字幕裡就算有 <script> 也只是文字
            if (r.i) e.style.fontStyle = 'italic';
            if (r.b) e.style.fontWeight = '700';
            if (r.u) e.style.textDecoration = 'underline';
            span.append(e);
          }
          row.append(span);
          sub.append(row);
        }
      }
    };

    /* --- 字幕設定面板 --- */
    const buildPanel = () => {
      panel.textContent = '';
      const line = (...els) => { const r = elx('div', 'pv-prow'); r.append(...els); panel.append(r); return r; };
      const lab = t => elx('span', 'nb-muted', t);
      const fileSel = elx('select', 'nb-sel');
      const off = elx('option', '', '不顯示字幕'); off.value = ''; fileSel.append(off);
      P.subs.cands.forEach((c, i) => { const o = elx('option', '', c.label); o.value = String(i); fileSel.append(o); });
      const other = elx('option', '', '載入其他字幕檔…'); other.value = '__file'; fileSel.append(other);
      fileSel.value = !mediaPrefs.sub || !P.subs.cur ? '' : String(P.subs.cands.findIndex(c => c.path === P.subs.cur.path));
      if (fileSel.value === '-1') fileSel.value = '';
      on(fileSel, 'change', async () => {
        if (fileSel.value === '__file') { subInput.click(); fileSel.value = ''; return; }
        if (fileSel.value === '') { mediaPrefs.sub = false; saveMediaPrefs(); paintSub(); return; }
        mediaPrefs.sub = true; saveMediaPrefs();
        await loadSubtitle(P, P.subs.cands[+fileSel.value]);
      });
      const subInput = elx('input'); subInput.type = 'file'; subInput.accept = '.srt,.vtt,.ass,.ssa'; subInput.hidden = true;
      on(subInput, 'change', async () => {
        const f = subInput.files && subInput.files[0];
        if (!f) return;
        const ext = extOf(f.name) || 'srt';
        const cand = { file: f, path: '', tag: '', ext, label: f.name };
        P.subs.cands = P.subs.cands.concat([cand]);
        mediaPrefs.sub = true; saveMediaPrefs();
        await loadSubtitle(P, cand);
      });
      const enc = elx('select', 'nb-sel');
      const auto = elx('option', '', '編碼：自動判斷'); auto.value = ''; enc.append(auto);
      SUB_ENCODINGS.forEach(([v, l]) => { const o = elx('option', '', l); o.value = v; enc.append(o); });
      enc.value = P.subs.forced || '';
      on(enc, 'change', () => { if (P.subs.cur) loadSubtitle(P, P.subs.cur, enc.value); });
      const encInfo = elx('span', 'nb-muted pv-encinfo', P.subs.cur ? '目前：' + P.subs.enc + (P.subs.guessed ? '（自動判斷；如果出現亂碼，請手動選擇）' : '') + ' · ' + P.subs.cues.length + ' 句' : '');
      line(lab('字幕'), fileSel, subInput, enc, encInfo);
      if (P.subs.error) line(elx('span', 'pv-bad', P.subs.error));
      const delayL = elx('span', 'pv-delay', (P.subs.delay >= 0 ? '+' : '') + P.subs.delay.toFixed(1) + ' 秒');
      const dBtn = (t, d) => btn(t, '字幕提早或延後', () => { P.subs.delay = Math.round((P.subs.delay + d) * 10) / 10; delayL.textContent = (P.subs.delay >= 0 ? '+' : '') + P.subs.delay.toFixed(1) + ' 秒'; paintSub(); });
      line(lab('時間'), dBtn('−0.5', -0.5), dBtn('−0.1', -0.1), delayL, dBtn('+0.1', 0.1), dBtn('+0.5', 0.5), btn('歸零', '', () => { P.subs.delay = 0; delayL.textContent = '+0.0 秒'; paintSub(); }), elx('span', 'nb-muted', '（正數＝字幕延後出現）'));
      const sizeL = elx('span', 'pv-size', Math.round(mediaPrefs.subSize * 100) + '%');
      const sBtn = (t, d) => btn(t, '', () => { mediaPrefs.subSize = Math.min(3, Math.max(0.5, Math.round((mediaPrefs.subSize + d) * 10) / 10)); sizeL.textContent = Math.round(mediaPrefs.subSize * 100) + '%'; saveMediaPrefs(); paintSub(); });
      const posL = elx('span', 'pv-pos', mediaPrefs.subPos + '%');
      const pBtn = (t, d) => btn(t, '', () => { mediaPrefs.subPos = Math.min(60, Math.max(1, mediaPrefs.subPos + d)); posL.textContent = mediaPrefs.subPos + '%'; saveMediaPrefs(); paintSub(); });
      line(lab('大小'), sBtn('A−', -0.1), sizeL, sBtn('A+', 0.1), lab('位置'), pBtn('▼', -2), posL, pBtn('▲', 2));
      const colorSel = elx('select', 'nb-sel');
      subColors.forEach(([v, l]) => { const o = elx('option', '', l); o.value = v; colorSel.append(o); });
      colorSel.value = mediaPrefs.subColor;
      on(colorSel, 'change', () => { mediaPrefs.subColor = colorSel.value; saveMediaPrefs(); paintSub(); });
      const bgSel = elx('select', 'nb-sel');
      [['none', '無底色'], ['dim', '半透明底'], ['solid', '黑底']].forEach(([v, l]) => { const o = elx('option', '', l); o.value = v; bgSel.append(o); });
      bgSel.value = mediaPrefs.subBg;
      on(bgSel, 'change', () => { mediaPrefs.subBg = bgSel.value; saveMediaPrefs(); paintSub(); });
      line(lab('顏色'), colorSel, bgSel);
    };

    /* --- 重畫各個狀態 --- */
    const paint = () => {
      play.textContent = m.paused || m.ended ? '▶' : '⏸';
      const d = isFinite(m.duration) ? m.duration : (P.sniff && P.sniff.duration) || 0;
      time.textContent = fmtTime(m.currentTime) + ' / ' + fmtTime(d);
      if (document.activeElement !== seek && d) seek.value = String(Math.round(m.currentTime / d * 1000));
      mute.textContent = m.muted || m.volume === 0 ? '已靜音' : '音量';
      if (document.activeElement !== vol) vol.value = String(m.muted ? 0 : Math.round(m.volume * 100));
      rate.value = String(m.playbackRate);
      loop.classList.toggle('on', m.loop);
      ab.classList.toggle('on', P.ab.a != null);
      ab.textContent = P.ab.a == null ? 'A–B' : P.ab.b == null ? 'A ' + fmtTime(P.ab.a) + ' → 設 B' : 'A–B ' + fmtTime(P.ab.a) + '–' + fmtTime(P.ab.b) + '（按一下清除）';
      flipH.classList.toggle('on', P.vt.flipH); flipV.classList.toggle('on', P.vt.flipV); rot.classList.toggle('on', P.vt.rot !== 0);
      cc.classList.toggle('on', !panel.hidden || (mediaPrefs.sub && !!P.subs.cur));
      const idx = siblingMedia(P.path); const at = idx.indexOf(P.path);
      prev.disabled = at <= 0; next.disabled = at < 0 || at >= idx.length - 1;
      const v = P.hasVideo;
      [flipH, flipV, rot, vtReset, shot, cc].forEach(b => { b.hidden = !v; });
      pip.hidden = !(v && document.pictureInPictureEnabled && typeof m.requestPictureInPicture === 'function');
      fs.textContent = isFs() ? '離開全螢幕' : '全螢幕';
      pinBtn.hidden = !isFs();
      pinBtn.classList.toggle('on', !!mediaPrefs.pinFs);
      pinBtn.textContent = mediaPrefs.pinFs ? '已釘選' : '釘選面板';
    };
    const refresh = () => {
      const s = P.sniff;
      m.hidden = !P.hasVideo;
      art.hidden = P.hasVideo;
      art.textContent = '';
      if (!P.hasVideo) {
        if (P.coverUrl) { const im = elx('img'); im.src = P.coverUrl; im.alt = '專輯封面'; art.append(im); }
        const t = (s && s.tags) || {};
        const box = elx('div', 'pv-tags');
        box.append(elx('div', 'pv-title', t.title || base(P.path)));
        [t.artist, t.album, [t.year, t.track && '第 ' + t.track + ' 軌'].filter(Boolean).join(' · ')].filter(Boolean).forEach(x => box.append(elx('div', 'pv-tag', x)));
        art.append(box);
      }
      info.textContent = '';
      if (s) {
        const parts = [];
        if (s.container) parts.push(CONTAINER_NAME[s.container] || s.container);
        if (s.video.length) parts.push('影像：' + s.video.map(codecLabel).join('、'));
        if (s.audio.length) parts.push('聲音：' + s.audio.map(codecLabel).join('、'));
        if (s.subs.length) parts.push('內嵌字幕：' + s.subs.map(x => x.name).join('、') + '（瀏覽器讀不到）');
        if (s.duration) parts.push('長度 ' + fmtTime(s.duration));
        parts.push(fmtSize(P.file.size));
        info.append(elx('div', 'pv-meta nb-muted', parts.join(' · ')));
        if (!P.error && (s.notes.length || !s.container)) {   // 標頭檢查發現的問題：播放之前就說，不用等使用者按了播放才碰壁
          const nw = elx('div', 'pv-warn warn');
          if (!s.container) nw.append(elx('div', '', '無法辨識這個檔案的格式（開頭的資料不像任何已知的影音容器），可能無法播放。'));
          s.notes.forEach(n => nw.append(elx('div', '', '檔案檢查：' + n + '。')));
          info.append(nw);
        }
        if (P.verdict && P.verdict.level !== 'ok' && !P.error) {
          const w = elx('div', 'pv-warn ' + P.verdict.level);
          P.verdict.lines.forEach(l => w.append(elx('div', '', l)));
          info.append(w);
        }
        if (P.hasVideo && P.subs.cands.length === 0 && !s.subs.length) info.append(elx('div', 'nb-muted pv-hint', '沒有找到同檔名的字幕檔（例如 ' + base(P.path).replace(/\.[^.]+$/, '') + '.srt）。可以在「字幕」裡手動載入。'));
      }
      if (P.error) {
        msg.hidden = false;
        msg.textContent = '';
        msg.append(elx('div', 'pv-msg-title', '這個檔案無法播放'));
        explainMediaError(P.error.code, P.sniff, P.verdict).forEach(l => msg.append(elx('div', 'pv-msg-line', l)));
      } else msg.hidden = true;
      buildPanel();
      paint();
      paintSub();
    };
    P.ui = { root, refresh, refreshSubs: () => { buildPanel(); paintSub(); } };

    /* --- 事件 --- */
    for (const ev of ['play', 'pause', 'ended', 'volumechange', 'ratechange', 'loadedmetadata', 'durationchange', 'seeked']) on(m, ev, paint);
    on(m, 'timeupdate', () => { paint(); paintSub(); });
    // 播放中逐格檢查字幕：timeupdate 約每 0.25 秒才一次，字幕會晚到 0.25 秒
    let subRaf = 0;
    const subLoop = () => { subRaf = 0; if (ac.signal.aborted || P.mode !== 'full' || m.paused) return; paintSub(); subRaf = requestAnimationFrame(subLoop); };
    const startSubLoop = () => { if (!subRaf && !m.paused && !ac.signal.aborted) subRaf = requestAnimationFrame(subLoop); };
    on(m, 'play', startSubLoop);
    startSubLoop();
    on(m, 'playing', () => {
      // 有聲音軌卻沒有解出聲音（常見於 AC-3 / DTS）：瀏覽器不會報錯，只是沒聲音
      setTimeout(() => {
        if (P.destroyed || !P.hasVideo || !P.sniff || !P.sniff.audio.length || m.paused || m.muted || m.currentTime < 1) return;
        if ((typeof m.webkitAudioDecodedByteCount === 'number' && m.webkitAudioDecodedByteCount === 0) || m.mozHasAudio === false) {
          if (!P.noSoundWarned) { P.noSoundWarned = true; notify('這個影片有聲音軌，但瀏覽器沒有解出聲音（聲音編碼：' + P.sniff.audio.map(codecLabel).join('、') + '，可能不支援）。', true); }
        }
      }, 1500);
    });
    on(seek, 'input', () => { const d = isFinite(m.duration) ? m.duration : 0; if (d) m.currentTime = seek.value / 1000 * d; });
    on(vol, 'input', () => { const v = vol.value / 100; m.muted = false; m.volume = v; });   // 先讀值再動元素：muted 的變動會觸發重繪，把滑桿改回舊值
    on(rate, 'change', () => { m.playbackRate = +rate.value; });
    on(pitch, 'change', () => { mediaPrefs.pitch = pitch.checked; saveMediaPrefs(); for (const k of ['preservesPitch', 'mozPreservesPitch', 'webkitPreservesPitch']) { try { if (k in m) m[k] = pitch.checked; } catch (_) {} } });
    on(stage, 'click', e => { if (e.target === m || e.target === stage || e.target === art) { root.focus({ preventScroll: true }); togglePlay(); } });   // 使用者點了畫面才取得焦點
    on(stage, 'dblclick', () => toggleFs());
    on(document, 'fullscreenchange', syncFs);
    on(document, 'webkitfullscreenchange', syncFs);
    for (const ev of ['mousemove', 'mousedown', 'touchstart', 'keydown', 'focusin']) on(root, ev, wake);
    ac.signal.addEventListener('abort', () => clearTimeout(idleT));
    on(window, 'resize', () => { applyVt(); paintSub(); });
    on(root, 'keydown', e => {
      if (e.target !== root && e.target !== m) return;                // 焦點在滑桿、下拉選單、按鈕上時，讓它們自己處理方向鍵與空白鍵
      if (e.ctrlKey || e.metaKey || e.altKey) return;
      const k = e.key;
      const handled = (() => {
        if (k === ' ' || k === 'k' || k === 'K') { togglePlay(); return true; }
        if (k === 'ArrowLeft') { seekBy(e.shiftKey ? -30 : -5); return true; }
        if (k === 'ArrowRight') { seekBy(e.shiftKey ? 30 : 5); return true; }
        if (k === 'ArrowUp') { m.muted = false; m.volume = Math.min(1, m.volume + 0.05); return true; }
        if (k === 'ArrowDown') { m.volume = Math.max(0, m.volume - 0.05); return true; }
        if (k === 'm' || k === 'M') { m.muted = !m.muted; return true; }
        if (k === '[' || k === ']') { const rs = [0.25, 0.5, 0.75, 1, 1.25, 1.5, 1.75, 2, 3, 4]; const i = rs.findIndex(r => r >= m.playbackRate - 0.001); m.playbackRate = rs[Math.max(0, Math.min(rs.length - 1, i + (k === ']' ? 1 : -1)))]; return true; }
        if (k === 'l' || k === 'L') { loop.click(); return true; }
        if (k === 'f' || k === 'F') { toggleFs(); return true; }
        if (k === 'r' || k === 'R') { if (P.hasVideo) { rot.click(); return true; } }
        if (k === 'h' || k === 'H') { if (P.hasVideo) { flipH.click(); return true; } }
        if (k === 'v' || k === 'V') { if (P.hasVideo) { flipV.click(); return true; } }
        if (k === 'c' || k === 'C') { if (P.hasVideo) { mediaPrefs.sub = !mediaPrefs.sub; saveMediaPrefs(); paintSub(); buildPanel(); return true; } }
        if (k === 'Home') { m.currentTime = 0; return true; }
        if (k === 'End') { if (isFinite(m.duration)) m.currentTime = m.duration; return true; }
        if (k === ',' || k === '.') { if (m.paused) { seekBy(k === ',' ? -1 / 30 : 1 / 30); return true; } }   // 逐格：瀏覽器沒有正式的逐格功能，這裡以每秒 30 格估算
        if (/^[0-9]$/.test(k) && isFinite(m.duration)) { m.currentTime = m.duration * (+k) / 10; return true; }
        if (k === 'Escape') { if (!document.fullscreenElement) { focusPane('tree'); return true; } }
        return false;
      })();
      if (handled) e.preventDefault();
    });

    viewer.replaceChildren(root);
    applyVt();
    refresh();
    return root;
  }

  /* ---------- 切走時：只有「正在播放」才會問 ---------- */
  function playerLeaving(newPath) {
    const P = state.player;
    if (!P || P.mode !== 'full' || P.path === newPath) return;
    if (!isPlaying(P)) { destroyPlayer(P); return; }   // 沒在播放（從沒按過播放、已暫停、播完了）：直接釋放，完全不打擾
    state.player = null;
    if (state.bg && state.bg !== P) destroyPlayer(state.bg);
    state.bg = P;
    mountMini(P, !P.asked);
    P.asked = true;
  }

  function mountMini(P, ask) {
    unmountUi(P);
    P.mode = 'mini';
    const ac = new AbortController();
    P.ac = ac;
    const sig = { signal: ac.signal };
    const on = (el, type, fn) => el.addEventListener(type, fn, sig);
    const m = P.media;
    miniEl.hidden = false;
    miniEl.textContent = '';
    miniEl.classList.toggle('asking', !!ask);
    const root = miniEl;
    const head = elx('div', 'mini-head');
    head.append(elx('span', 'mini-title', '♪ ' + base(P.path)));
    const back = elx('button', 'btn', '回到這個檔案'); back.type = 'button';
    on(back, 'click', () => previewFile(P.path));
    const close = elx('button', 'btn', '✕'); close.type = 'button'; close.title = '停止並關閉';
    on(close, 'click', () => destroyPlayer(P));
    head.append(back, close);
    root.append(head);
    if (ask) {
      const q = elx('div', 'mini-ask');
      q.append(elx('div', 'mini-q', '「' + base(P.path) + '」正在播放。切換到其他檔案後，要怎麼處理？'));
      const row = elx('div', 'mini-btns');
      const b1 = elx('button', 'btn primary', '繼續播放'); b1.type = 'button';
      const b2 = elx('button', 'btn', '暫停'); b2.type = 'button';
      const b3 = elx('button', 'btn', '停止'); b3.type = 'button';
      on(b1, 'click', () => { q.remove(); root.classList.remove('asking'); });
      on(b2, 'click', () => { m.pause(); P.asked = false; q.remove(); root.classList.remove('asking'); });   // 選「暫停」不代表之後都不要問：再按播放就是新的一次播放，切走時要再問
      on(b3, 'click', () => destroyPlayer(P));
      row.append(b1, b2, b3);
      q.append(row);
      root.append(q);
    }
    if (P.hasVideo) {
      const slot = elx('div', 'mini-video');
      m.style.transform = '';
      slot.append(m);
      root.append(slot);
    } else mediaHost.append(m);
    const bar = elx('div', 'mini-bar');
    const play = elx('button', 'btn', '⏸'); play.type = 'button';
    const seek = elx('input'); seek.type = 'range'; seek.min = '0'; seek.max = '1000'; seek.value = '0';
    const time = elx('span', 'pv-time', '0:00');
    const vol = elx('input', 'pv-vol'); vol.type = 'range'; vol.min = '0'; vol.max = '100'; vol.value = String(Math.round(m.volume * 100));
    bar.append(play, seek, time, vol);
    root.append(bar);
    const paint = () => {
      play.textContent = m.paused || m.ended ? '▶' : '⏸';
      const d = isFinite(m.duration) ? m.duration : 0;
      time.textContent = fmtTime(m.currentTime) + (d ? ' / ' + fmtTime(d) : '');
      if (document.activeElement !== seek && d) seek.value = String(Math.round(m.currentTime / d * 1000));
    };
    on(play, 'click', () => { if (m.paused || m.ended) m.play().catch(() => {}); else m.pause(); });
    on(seek, 'input', () => { if (isFinite(m.duration)) m.currentTime = seek.value / 1000 * m.duration; });
    on(vol, 'input', () => { const v = vol.value / 100; m.muted = false; m.volume = v; });
    for (const ev of ['play', 'pause', 'ended', 'timeupdate', 'durationchange']) on(m, ev, paint);
    P.ui = { root: null, refresh: paint, refreshSubs() {} };
    paint();
  }

  // 預覽區要顯示影音檔：有現成的播放器（預覽區或背景的）就接回來，沒有才新建
  function renderPlayerView(path, info, kind, file) {
    let P = state.player && state.player.path === path ? state.player : null;
    if (!P && state.bg && state.bg.path === path) { P = state.bg; state.bg = null; }
    if (!P) { if (state.player) destroyPlayer(state.player); P = createPlayer(path, file, kind); }
    state.player = P;
    metaText.textContent = (kind === 'video' ? '影片' : '音訊') + ' · ' + fmtSize(info.size);
    mountFull(P);
    return true;
  }

  function renderMedia(path, info) {
    const ext = extOf(path), kind = info.media || MEDIA_EXT[ext];
    if (!kind) return false;
    const file = state.files.get(path);
    if (state.fromSnapshot || !file) {
      viewer.textContent = '';
      viewer.append(snapshotNotice('圖片、PDF 與影音'));
      return true;
    }
    if (kind === 'audio' || kind === 'video') return renderPlayerView(path, info, kind, file);
    const url = URL.createObjectURL(new Blob([file], { type: kind === 'pdf' ? 'application/pdf' : MD_IMG_MIME[ext] }));
    state.mdUrls.push(url);
    metaText.textContent = (kind === 'pdf' ? 'PDF' : ext.toUpperCase()) + ' · ' + fmtSize(info.size);
    if (kind === 'pdf') {
      const root = elx('div', 'media');
      const bar = elx('div', 'mbar');
      const a = elx('a', 'btn', '在新分頁開啟');
      a.href = url; a.target = '_blank'; a.rel = 'noopener';
      bar.append(a, elx('span', 'nb-muted', '如果下方沒有顯示，請用「在新分頁開啟」'));
      const frame = elx('iframe', 'pdf');
      frame.title = base(path);
      const hadPane = state.pane;
      frame.addEventListener('load', () => keepPaneFocus(hadPane, () => state.active === path));
      frame.src = url;
      root.append(bar, frame);
      viewer.textContent = '';
      viewer.append(root);
    } else {
      imageStage(url, base(path));
    }
    return true;
  }

  // SVG 也是文字：預設看圖，可以切回原始碼。用 <img> 顯示，SVG 裡的 script 不會執行

  /* ===================== HTML 預覽：沙盒 iframe（預設不執行腳本、不連外） ===================== */

    b3.hidden = !/^values.*\.ya?ml$/i.test(base(v.path));
    b3.title = '複製成 Helm 模板裡引用這個 value 的寫法';
    viewBar.append(elx('span', 'nb-muted', 'key 路徑'), pathEl, b1, b2, b3,
      elx('span', 'nb-muted yp-hint', 'Helm：按住 Ctrl（Mac 用 ⌘）點 include 名稱、.Values.x、.Chart.x 可跳到定義'));
    v.ybar = { pathEl, btns: [b1, b2, b3] };
    v.ysel = null;
  }

  function showYamlPath(v, i) {
    if (!v.raw || !v.ybar) return;
    if (!v.ypaths) { v.ypaths = yamlLinePaths(v.raw); v.ydocs = yamlDocMeta(v.raw, v.ypaths); }
    const info = v.ypaths[i];
    if (!info) return;
    v.ysel = info;
    const multi = v.ypaths[v.ypaths.length - 1].doc > 1;
    const m = v.ydocs.get(info.doc) || {};
    const prefix = m.kind ? m.kind + (m.name ? '/' + m.name : '') : (multi ? '文件 ' + info.doc : '');
    v.ybar.pathEl.classList.remove('nb-muted');
    v.ybar.pathEl.textContent = (prefix ? prefix + ' › ' : '') + (info.path.length ? yamlPathStr(info.path) : '（頂層）');
    v.ybar.btns.forEach(b => { b.disabled = !info.path.length; });
  }

  // 點擊位置在這一行的第幾個字元
  function colFromEvent(e, line) {
    const v = state.view;
    let node = null, off = 0;
    if (document.caretRangeFromPoint) {
      const r = document.caretRangeFromPoint(e.clientX, e.clientY);
      if (r) { node = r.startContainer; off = r.startOffset; }
    } else if (document.caretPositionFromPoint) {
      const p = document.caretPositionFromPoint(e.clientX, e.clientY);
      if (p) { node = p.offsetNode; off = p.offset; }
    }
    if (node) {
      const host = v.layout === 'rows' ? (node.parentElement && node.parentElement.closest('.tx')) : viewer.querySelector('.body');
      if (host && host.contains(node)) {
        const r2 = document.createRange();
        r2.setStart(host, 0);
        r2.setEnd(node, off);
        const len = r2.toString().length;
        if (v.layout === 'rows') return len;
        // 雙欄版面：整份文字裡的位置 -> 這一行的位置（用畫面上實際的文字算，避免和原始文字有出入）
        const shown = host.textContent.split('\n');
        let acc = 0;
        for (let k = 0; k < line; k++) acc += (shown[k] || '').length + 1;
        return Math.max(0, len - acc);
      }
    }
    // 沒有可用的 API：用字元寬度估算
    const host = v.layout === 'rows' ? (e.target.closest && e.target.closest('.tx')) : viewer.querySelector('.body');
    if (!host) return 0;
    const probe = document.createElement('span');
    probe.style.cssText = 'position:absolute;visibility:hidden;white-space:pre';
    probe.textContent = '0'.repeat(50);
    host.append(probe);
    const cw = probe.getBoundingClientRect().width / 50 || 8;
    probe.remove();
    return Math.max(0, Math.round((e.clientX - host.getBoundingClientRect().left - 16) / cw));
  }

  /* ---------- 找定義 ---------- */
  const dirOfPath = p => (p.indexOf('/') === -1 ? '' : p.slice(0, p.lastIndexOf('/')));
  const helmChartRoot = from => { const k = from.lastIndexOf('/templates/'); return k !== -1 ? from.slice(0, k) : dirOfPath(from); };

  // 從目前檔案所在的 chart 一路往上，列出所有這種名稱的檔案（子 chart 的 values 找不到時，可以往父 chart 找）
  function helmFilesUp(from, names) {
    const out = [];
    let dir = helmChartRoot(from);
    for (;;) {
      for (const n of names) { const p = dir ? dir + '/' + n : n; if (state.files.has(p)) { out.push(p); break; } }
      if (!dir) break;
      dir = dirOfPath(dir);
    }
    return out;
  }

  async function helmDefs() {
    if (state.helmDefs) return state.helmDefs;
    const defs = new Map();
    const paths = [...state.files.keys()].filter(p => !MEDIA_EXT[extOf(p)] && state.files.get(p).size <= 2 * 1024 * 1024);
    if (paths.length > 300) notify('第一次跳轉，正在建立 include 索引…', true);
    for (let i = 0; i < paths.length; i += 12) {
      const infos = await Promise.all(paths.slice(i, i + 12).map(p => getInfo(p).catch(() => null)));
      infos.forEach((info, k) => {
        if (!info || info.binary || !info.text.includes('define')) return;
        const lines = info.text.split('\n');
        for (let ln = 0; ln < lines.length; ln++) {
          const re = /\{\{-?\s*define\s+"([^"]+)"/g;
          let m;
          while ((m = re.exec(lines[ln]))) {
            const list = defs.get(m[1]) || [];
            list.push({ path: paths[i + k], line: ln, col: m.index });
            defs.set(m[1], list);
          }
        }
      });
    }
    state.helmDefs = defs;
    return defs;
  }

  // 在一份 YAML 裡找路徑對應的行；找不到完整路徑就找「最長的上層」
  async function yamlFindPath(file, segs) {
    const info = await getInfo(file);
    if (!info || info.binary) return null;
    const lines = info.text.replace(/\r\n?/g, '\n').split('\n');
    const paths = yamlLinePaths(lines);
    for (let n = segs.length; n >= 0; n--) {
      const want = JSON.stringify(segs.slice(0, n));
      const idx = paths.findIndex(p => JSON.stringify(p.path) === want);
      if (idx !== -1) return { line: idx, matched: n, col: /^ */.exec(lines[idx])[0].length };
    }
    return { line: 0, matched: 0, col: 0 };
  }

  const sameFileGo = (path, line, col) => {
    if (state.view && state.view.path === path && state.viewMode === 'code') {
      FS.curLine = { path, line };
      placeCurLine();
      scrollToLine(line, col);
    } else openAt(path, line, col, false);
  };

  async function helmJump(i, e) {
    const v = state.view;
    if (!v || !v.raw) return;
    e.preventDefault();
    const tok = helmTokenAt(v.raw[i] || '', colFromEvent(e, i));
    if (!tok) { notify('這裡沒有可以跳轉的 include / .Values / .Chart。'); return; }
    const from = v.path;

    if (tok.type === 'define') {
      const defs = await helmDefs();
      const list = defs.get(tok.name) || [];
      if (!list.length) { notify('找不到 define "' + tok.name + '" 的定義。'); return; }
      const common = (a, b) => { const A = a.split('/'), B = b.split('/'); let n = 0; while (n < A.length && n < B.length && A[n] === B[n]) n++; return n; };
      const hit = [...list].sort((x, y) => common(y.path, from) - common(x.path, from))[0];
      if (list.length > 1) notify('有 ' + list.length + ' 個同名的 define，已跳到離目前檔案最近的一個。');
      sameFileGo(hit.path, hit.line, hit.col);
      return;
    }

    if (tok.type === 'chart') {
      const f = helmFilesUp(from, ['Chart.yaml'])[0];
      if (!f) { notify('找不到 Chart.yaml。'); return; }
      const r = await yamlFindPath(f, [tok.key]);
      if (!r || r.matched === 0) notify('Chart.yaml 裡沒有 ' + tok.key + '。');
      sameFileGo(f, r ? r.line : 0, r ? r.col : 0);
      return;
    }

    // values：先看最近的 values.yaml，沒有這個 key 就往父 chart 找；都沒有就停在最接近的上層
    let files = helmFilesUp(from, ['values.yaml', 'values.yml']);
    if (!files.length) {
      files = [...state.files.keys()].filter(p => /(^|\/)values\.ya?ml$/.test(p)).sort((a, b) => a.length - b.length).slice(0, 1);
    }
    if (!files.length) { notify('資料夾裡沒有 values.yaml。'); return; }
    let best = null;
    for (const f of files) {
      const r = await yamlFindPath(f, tok.path);
      if (!r) continue;
      if (!best || r.matched > best.r.matched) best = { f, r };
      if (r.matched === tok.path.length) break;
    }
    if (!best) { notify('values.yaml 讀取失敗。', true); return; }
    if (best.r.matched < tok.path.length) {
      notify((best.r.matched ? '「' + yamlPathStr(tok.path) + '」在 ' + base(best.f) + ' 裡沒有定義，已停在最接近的上層「' + yamlPathStr(tok.path.slice(0, best.r.matched)) + '」。'
        : '「' + yamlPathStr(tok.path) + '」在 ' + base(best.f) + ' 裡沒有定義。'));
    }
    sameFileGo(best.f, best.r.line, best.r.col);
  }

  CLICK_HOOKS.push((i, e) => {
    const v = state.view;
    if (!v) return;
    if (e.ctrlKey || e.metaKey) { helmJump(i, e); return; }
    if (v.lang === 'yaml') showYamlPath(v, i);
  });

  /* ===================== 導覽：上一頁/下一頁、Ctrl+P 快速開檔、Ctrl+G 跳到行、還原分頁 ===================== */
  const navBack = $('navBack'), navFwd = $('navFwd');
  const qoModal = $('qoModal'), qoInput = $('qoInput'), qoList = $('qoList'), qoFoot = $('qoFoot');
  const NAV_MAX = 100;
  state.nav = { list: [], pos: -1, moving: false };   // 瀏覽紀錄：{ path, line }
  state.mru = [];                                    // 最近開過的檔案（新的在前）

  /* ---------- 上一頁 / 下一頁 ---------- */
  function navPush(path) {
    const n = state.nav;
    if (n.moving) return;
    const cur = n.list[n.pos];
    if (cur && cur.path === path) return;
    if (cur && state.view && state.view.path === cur.path) cur.line = topLine();   // 離開前記住捲到哪
    n.list.length = n.pos + 1;
    n.list.push({ path, line: null });
    if (n.list.length > NAV_MAX) n.list.shift();
    n.pos = n.list.length - 1;
    navUpdate();
  }

  function navTarget(dir) {
    const n = state.nav;
    let p = n.pos + dir;
    while (p >= 0 && p < n.list.length && !state.files.has(n.list[p].path)) p += dir;   // 跳過已經不存在的檔案
    return p >= 0 && p < n.list.length ? p : -1;
  }

  function navGo(dir) {
    const n = state.nav;
    const p = navTarget(dir);
    if (p < 0) return;
    const cur = n.list[n.pos];
    if (cur && state.view && state.view.path === cur.path) cur.line = topLine();
    n.pos = p;
    const e = n.list[p];
    n.moving = true;
    if (e.line != null) state.keepLine = e.line;   // 回到離開時的位置
    try { previewFile(e.path); } finally { n.moving = false; }
    navUpdate();
  }

  function navUpdate() {
    navBack.disabled = navTarget(-1) < 0;
    navFwd.disabled = navTarget(1) < 0;
  }
  navBack.addEventListener('click', () => navGo(-1));
  navFwd.addEventListener('click', () => navGo(1));
  window.addEventListener('keydown', e => {
    if (e.altKey && !e.ctrlKey && !e.metaKey && (e.key === 'ArrowLeft' || e.key === 'ArrowRight')) {
      e.preventDefault();
      navGo(e.key === 'ArrowLeft' ? -1 : 1);
    }
  });
  // 滑鼠的上一頁 / 下一頁側鍵
  const sideBtn = e => { if (e.button === 3 || e.button === 4) { e.preventDefault(); if (e.type === 'mouseup') navGo(e.button === 3 ? -1 : 1); } };
  window.addEventListener('mousedown', sideBtn);
  window.addEventListener('mouseup', sideBtn);

  function mruTouch(path) {
    const i = state.mru.indexOf(path);
    if (i !== -1) state.mru.splice(i, 1);
    state.mru.unshift(path);
    if (state.mru.length > 50) state.mru.pop();
  }

  /* ---------- 還原分頁（依資料夾分開存在 IndexedDB） ---------- */
  let sessionTimer = null;
  function scheduleSessionSave() {
    clearTimeout(sessionTimer);
    sessionTimer = setTimeout(saveSession, 400);
  }
  async function saveSession() {
    if (!state.root) return;
    const key = groupKey();
    try {
      await idbSet('session:' + key, { tabs: state.tabs.map(t => ({ path: t.path, pinned: t.pinned })), active: state.active, savedAt: Date.now() });
    } catch (_) {}
  }
  async function restoreSession(key) {
    let data = null;
    try { data = await idbGet('session:' + key); } catch (_) {}
    if (!data || !Array.isArray(data.tabs)) return;
    if (!state.root || groupKey() !== key) return;     // 期間換了別的資料夾
    if (state.tabs.length || state.active) return;     // 使用者已經自己開了檔案，不要覆蓋
    const tabs = data.tabs.filter(t => t && typeof t.path === 'string' && state.files.has(t.path)).map(t => ({ path: t.path, pinned: !!t.pinned }));
    if (!tabs.length) return;
    state.tabs = tabs;
    tabs.forEach(t => mruTouch(t.path));
    const active = state.files.has(data.active) && tabs.some(t => t.path === data.active) ? data.active : tabs[tabs.length - 1].path;
    activate(active, true);
    notify('已還原上次開啟的 ' + tabs.length + ' 個分頁。');
  }

  /* ---------- Ctrl+P 快速開檔 / Ctrl+G 跳到行 ---------- */
  const QO = { open: false, mode: 'file', items: [], sel: 0, lines: 0, prevFocus: null };

  // 比對檔案路徑：每個詞要「連續出現」或「依序出現（模糊）」；回傳分數與命中的位置
  function qoMatch(query, path) {
    const terms = query.toLowerCase().split(/\s+/).filter(Boolean);
    if (!terms.length) return { score: 0, idx: [] };
    const lo = path.toLowerCase(), baseStart = path.lastIndexOf('/') + 1;
    let score = 0;
    const idx = new Set();
    for (const t of terms) {
      const p = lo.indexOf(t);
      if (p !== -1) {
        score += 100 + (p >= baseStart ? 60 : 0) + (p === baseStart ? 40 : 0) - Math.min(30, p / 2);
        for (let k = 0; k < t.length; k++) idx.add(p + k);
        continue;
      }
      let k = 0, last = -2, sc = 0;
      const pos = [];
      for (let i = 0; i < lo.length && k < t.length; i++) {
        if (lo[i] === t[k]) {
          sc += (i === last + 1 ? 8 : 1) + (i === 0 || '/-_.'.includes(lo[i - 1]) ? 6 : 0);
          last = i;
          pos.push(i);
          k++;
        }
      }
      if (k < t.length) return null;
      score += sc;
      pos.forEach(i => idx.add(i));
    }
    return { score: score - path.length * 0.05, idx: [...idx].sort((a, b) => a - b) };
  }

  // 把路徑拆成「檔名」與「資料夾」，命中的字元加上標記
  function qoHtml(path, idx) {
    const set = new Set(idx);
    const cut = path.lastIndexOf('/') + 1;
    const part = (from, to) => {
      let out = '', open = false;
      for (let i = from; i < to; i++) {
        const hit = set.has(i);
        if (hit && !open) { out += '<mark class="hit">'; open = true; }
        if (!hit && open) { out += '</mark>'; open = false; }
        out += esc(path[i]);
      }
      return out + (open ? '</mark>' : '');
    };
    return '<span class="qo-name">' + part(cut, path.length) + '</span><span class="qo-dir">' + part(0, cut) + '</span>';
  }

  function parseQuick(q) {
    const m = /^(.*?)(?::(\d+))?$/.exec(q.trim());
    return { text: m[1], line: m[2] ? +m[2] : null };
  }

  function qoRefresh() {
    qoList.textContent = '';
    qoFoot.textContent = '';
    if (QO.mode === 'line') {
      qoList.hidden = true;
      qoFoot.textContent = state.active
        ? '輸入行號（可加欄位，例如 120:8）' + (QO.lines ? ' · 這個檔案共 ' + QO.lines + ' 行' : '') + ' · Enter 跳轉 · Esc 取消'
        : '請先打開一個檔案。';
      return;
    }
    qoList.hidden = false;
    if (!state.root) { qoList.innerHTML = '<div class="fs-empty">請先載入資料夾。</div>'; return; }
    const { text, line } = parseQuick(qoInput.value);
    const all = [...state.files.keys()];
    let items;
    if (!text.trim()) {
      const recent = state.mru.filter(p => state.files.has(p));
      const rest = all.filter(p => !recent.includes(p)).sort((a, b) => a.localeCompare(b, undefined, { numeric: true }));
      items = recent.concat(rest).slice(0, 60).map(p => ({ path: p, idx: [] }));
    } else {
      items = [];
      for (const p of all) { const m = qoMatch(text, p); if (m) items.push({ path: p, idx: m.idx, score: m.score }); }
      items.sort((a, b) => b.score - a.score || a.path.localeCompare(b.path));
      items = items.slice(0, 60);
    }
    QO.items = items;
    QO.sel = Math.min(QO.sel, Math.max(0, items.length - 1));
    if (!items.length) { qoList.innerHTML = '<div class="fs-empty">沒有符合的檔案。</div>'; }
    else {
      qoList.innerHTML = items.map((it, i) => '<div class="qo-item' + (i === QO.sel ? ' sel' : '') + '" data-i="' + i + '">' + qoHtml(it.path, it.idx) + '</div>').join('');
    }
    qoFoot.textContent = (line ? '開啟後跳到第 ' + line + ' 行 · ' : '') + '↑↓ 選擇 · Enter 開啟 · Esc 取消 · 可輸入「檔名:行號」';
    const sel = qoList.querySelector('.qo-item.sel');
    if (sel) sel.scrollIntoView({ block: 'nearest' });
  }

  async function openQuick(mode) {
    QO.prevFocus = document.activeElement;
    QO.open = true;
    QO.mode = mode;
    QO.sel = 0;
    QO.lines = 0;
    qoModal.hidden = false;
    qoInput.value = '';
    qoInput.placeholder = mode === 'file' ? '輸入檔名開啟（空白分隔多個詞；檔名:行號 可直接跳行）' : '跳到行號…';
    qoRefresh();
    qoInput.focus();
    if (mode === 'line' && state.active) {
      const info = await getInfo(state.active);
      if (QO.open && info && !info.binary) { QO.lines = info.text.replace(/\r\n?/g, '\n').replace(/\n$/, '').split('\n').length; qoRefresh(); }
    }
  }
  function closeQuick() {
    if (!QO.open) return;
    QO.open = false;
    qoModal.hidden = true;
    try { if (QO.prevFocus && QO.prevFocus.focus) QO.prevFocus.focus({ preventScroll: true }); } catch (_) {}
  }

  function quickAccept() {
    if (QO.mode === 'line') {
      const m = /^\s*(\d+)(?::(\d+))?\s*$/.exec(qoInput.value);
      if (!m || !state.active) return;
      let line = Math.max(1, +m[1]);
      if (QO.lines) line = Math.min(line, QO.lines);
      const path = state.active;
      closeQuick();
      openAt(path, line - 1, m[2] ? +m[2] - 1 : 0, false);
      viewer.focus({ preventScroll: true });
      return;
    }
    const it = QO.items[QO.sel];
    if (!it) return;
    const { line } = parseQuick(qoInput.value);
    closeQuick();
    if (line) openAt(it.path, line - 1, 0, true);
    else pinFile(it.path);
    viewer.focus({ preventScroll: true });
  }

  qoInput.addEventListener('input', () => { QO.sel = 0; qoRefresh(); });
  qoInput.addEventListener('keydown', e => {
    if (e.isComposing) return;
    if (e.key === 'Escape') { e.preventDefault(); closeQuick(); }
    else if (e.key === 'Enter') { e.preventDefault(); quickAccept(); }
    else if (QO.mode === 'file' && (e.key === 'ArrowDown' || e.key === 'ArrowUp')) {
      e.preventDefault();
      if (!QO.items.length) return;
      QO.sel = (QO.sel + (e.key === 'ArrowDown' ? 1 : -1) + QO.items.length) % QO.items.length;
      qoList.querySelectorAll('.qo-item').forEach((el, i) => el.classList.toggle('sel', i === QO.sel));
      const sel = qoList.querySelector('.qo-item.sel');
      if (sel) sel.scrollIntoView({ block: 'nearest' });
    }
  });
  qoList.addEventListener('click', e => {
    const it = e.target.closest('.qo-item');
    if (!it) return;
    QO.sel = +it.dataset.i;
    quickAccept();
  });
  qoModal.addEventListener('mousedown', e => { if (e.target === qoModal) closeQuick(); });

  window.addEventListener('keydown', e => {
    if (!(e.ctrlKey || e.metaKey) || e.altKey || e.shiftKey) return;
    const k = e.key.toLowerCase();
    if (k === 'p') { e.preventDefault(); openQuick('file'); }
    else if (k === 'g') { e.preventDefault(); openQuick('line'); }
  });

  /* ===================== 壓縮檔：拖入 .tgz / .tar.gz / .zip 直接瀏覽，不用先解壓 ===================== */
  const archivePicker = $('archivePicker');

  async function archiveToEntries(file) {
    const u8 = new Uint8Array(await file.arrayBuffer());
    await tick();   // 讓「解壓縮中」的提示先畫出來（解壓是同步運算，會暫時卡住畫面）
    const r = archiveToFiles(archiveExtract(file.name, u8, window.fflate), file.name);
    if (!r.files.length) throw new Error('壓縮檔裡沒有可以顯示的檔案。');
    return { entries: r.files.map(f => ({ path: f.path, file: new File([f.data], base(f.path)) })), skipped: r.skipped };
  }

  // items: File，或 { file, handle }。有 handle（檔案憑證）就記下來，之後從「最近開啟」不用再重新選
  async function loadArchives(items) {
    let list = [...items].map(it => (it && it.file ? it : { file: it, handle: null }));
    const unsup = list.filter(x => unsupportedArchive(x.file.name));
    if (unsup.length) {
      notify(unsup.map(x => unsupportedArchiveText(x.file.name, unsupportedArchive(x.file.name))).join('\n'), true);
      list = list.filter(x => !unsupportedArchive(x.file.name));
      if (!list.length) return;
    }
    if (list.some(x => !/\.tar$/i.test(x.file.name)) && !libOk('fflate')) {
      notify('解開 .tgz / .zip / .gz 需要 fflate：同一個資料夾找不到 fflate.umd.js，也無法載入線上版（可能沒有網路）。請連上網路後重新整理，或把檔案放在這個 HTML 的同一個資料夾。（純 .tar 不需要）', true);
      return;
    }
    for (let i = 0; i < list.length; i++) {
      const { file: f, handle } = list[i];
      notify('解壓縮「' + f.name + '」中…', true);
      await tick();
      try {
        const { entries, skipped } = await archiveToEntries(f);
        loadEntries(entries, [], handle || null, { source: 'archive' });
        // 一次載入多個壓縮檔：等這一份記好再換下一份，不然會被「換了別的資料夾」中斷
        if (i < list.length - 1 && state.savePromise) await state.savePromise;
        notify('已解開「' + f.name + '」：' + entries.length + ' 個檔案' + (skipped ? '，略過 ' + skipped + ' 個不安全或沒用的項目（例如 ../ 路徑、.DS_Store）' : ''));
      } catch (err) {
        notify('無法解開「' + f.name + '」：' + ((err && err.message) || err), true);
      }
    }
    if (list.length > 1) notify('已載入 ' + list.length + ' 個壓縮檔，畫面上顯示的是最後一個；其餘都在「最近開啟」，可以用來做版本比對。');
  }

  // 選壓縮檔：優先用新式檔案選擇器（可以記住憑證，之後免重選），不行再退回一般的
  async function pickArchives() {
    if (typeof window.showOpenFilePicker === 'function') {
      try {
        const hs = await window.showOpenFilePicker({
          multiple: true,
          types: [{ description: '壓縮檔', accept: { 'application/gzip': ['.tgz', '.gz'], 'application/x-tar': ['.tar'], 'application/zip': ['.zip'] } }]
        });
        loadArchives(await Promise.all(hs.map(async h => ({ file: await h.getFile(), handle: h }))));
        return;
      } catch (err) {
        if (err && err.name === 'AbortError') return;
        // 其他原因（例如系統保護的資料夾）：退回一般檔案選擇器
      }
    }
    archivePicker.click();
  }

  // 沒有憑證的文字快照：圖片、PDF 與大檔案沒有內容，直接給「重新選擇」的按鈕
  function snapshotNotice(what) {
    const box = elx('div', 'notice');
    box.append(document.createTextNode('這是文字快照（原本的來源沒有授權憑證），不含' + what + '。'));
    box.append(document.createElement('br'));
    const archive = state.source === 'archive';
    const b = elx('button', 'btn primary', archive ? '重新選擇壓縮檔' : '重新選擇資料夾');
    b.type = 'button';
    b.style.marginTop = '10px';
    b.addEventListener('click', () => (archive ? pickArchives() : pickFolder()));
    box.append(b);
    return box;
  }

  $('archiveBtn').addEventListener('click', pickArchives);
  $('archivePickBtn').addEventListener('click', pickArchives);
  archivePicker.addEventListener('change', () => {
    const files = [...archivePicker.files];
    try { archivePicker.value = ''; } catch (_) {}
    if (files.length) loadArchives(files);
  });

  /* ===================== 左側檢視器的鍵盤：↑↓ 移動目前行 ===================== */
  // 焦點在哪一欄，方向鍵就屬於哪一欄：在檢視器裡，↑↓ 移動檔案中的光標行；只有焦點在右側目錄時才操作目錄
  function lineHeightPx() {
    const v = state.view;
    if (!v) return 20;
    if (v.layout === 'rows') {
      const r = viewer.querySelector('.ln');
      return r ? (r.getBoundingClientRect().height || r.offsetHeight || 20) : 20;
    }
    const body = viewer.querySelector('.body');
    return (body && v.lines.length && body.offsetHeight / v.lines.length) || 20;
  }

  // 只在需要時捲動：目前行已經看得到就不動，免得畫面一直跳
  function ensureLineVisible(line) {
    const v = state.view;
    if (!v) return;
    const vr = viewer.getBoundingClientRect();
    if (v.layout === 'rows') {
      const row = viewer.querySelector('.ln[data-i="' + line + '"]');
      if (!row) return;
      const r = row.getBoundingClientRect();
      if (r.top < vr.top) viewer.scrollTop -= (vr.top - r.top) + r.height;
      else if (r.bottom > vr.bottom) viewer.scrollTop += (r.bottom - vr.bottom) + r.height;
      return;
    }
    const body = viewer.querySelector('.body'), code = viewer.querySelector('.code');
    if (!body || !code) return;
    const lh = lineHeightPx();
    const top = parseFloat(getComputedStyle(code).paddingTop) + line * lh, bottom = top + lh;
    if (top < viewer.scrollTop) viewer.scrollTop = Math.max(0, top - lh);
    else if (bottom > viewer.scrollTop + viewer.clientHeight) viewer.scrollTop = bottom - viewer.clientHeight + lh;
  }

  function moveLineCursor(line) {
    const v = state.view;
    FS.curLine = { path: v.path, line };
    placeCurLine();
    ensureLineVisible(line);
    if (v.lang === 'yaml') showYamlPath(v, line);   // 路徑列跟著光標走
  }

  function viewerKeydown(e, forced) {
    if ((!forced && e.target !== viewer) || e.ctrlKey || e.metaKey || e.altKey) return;
    if (e.key === 'Escape') {   // 回到右側目錄
      if (state.root) { e.preventDefault(); treeEl.focus({ preventScroll: true }); }
      return;
    }
    if (state.viewMode !== 'code' || !state.view) return;   // 其他檢視（Markdown、圖片…）維持瀏覽器原本的捲動行為
    if (!['ArrowDown', 'ArrowUp', 'PageDown', 'PageUp', 'Home', 'End'].includes(e.key)) return;
    e.preventDefault();
    const v = state.view, rows = v.rows;                    // 有篩選時，只在看得到的行之間移動
    const total = rows ? rows.length : v.lines.length;
    if (!total) return;
    const cl = FS.curLine && FS.curLine.path === v.path ? FS.curLine.line : -1;
    let pos = cl < 0 ? -1 : (rows ? rows.indexOf(cl) : cl);
    if (cl >= 0 && pos < 0) { pos = rows.findIndex(r => r >= cl); if (pos < 0) pos = total - 1; }   // 光標那行被篩掉了：落在它後面最近的可見行
    const page = Math.max(1, Math.floor(viewer.clientHeight / lineHeightPx()) - 1);
    let target;
    if (pos < 0) {   // 還沒有光標：從畫面最上面那一行開始
      const top = topLine();
      let tp = rows ? rows.findIndex(r => r >= top) : top;
      if (tp < 0) tp = total - 1;
      target = e.key === 'End' ? total - 1 : e.key === 'Home' ? 0 : e.key === 'PageDown' ? tp + page : e.key === 'PageUp' ? tp - page : tp;
    } else {
      target = e.key === 'ArrowDown' ? pos + 1 : e.key === 'ArrowUp' ? pos - 1 : e.key === 'PageDown' ? pos + page : e.key === 'PageUp' ? pos - page : e.key === 'Home' ? 0 : total - 1;
    }
    target = Math.max(0, Math.min(total - 1, target));
    moveLineCursor(rows ? rows[target] : target);
  }
  viewer.addEventListener('keydown', e => viewerKeydown(e, false));

  // 點程式碼區：焦點交給檢視器，之後的方向鍵就是移動這個檔案裡的光標
  CLICK_HOOKS.push(() => viewer.focus({ preventScroll: true }));

  /* ===================== 鍵盤焦點：哪一邊有焦點，要一眼看得出來 ===================== */
  // 方向鍵屬於「有焦點的那一邊」：右側目錄，或左側預覽區。標題列有標籤、外面有粗框；另一邊的游標會淡化。
  state.pane = '';           // 現在真正有鍵盤焦點的是哪一邊：tree / viewer / ''（兩邊都沒有）
  state.lastPane = 'tree';   // 最後操作的是哪一邊（焦點掉到空白處時，方向鍵還是交給它）
  const chipTree = $('chipTree'), chipView = $('chipView');

  function paneOf(el) {
    if (!el || el === document.body || el === document.documentElement) return '';
    if (treeEl.contains(el)) return 'tree';
    if (viewer.contains(el)) return 'viewer';
    return '';
  }
  function syncPane() {
    const p = paneOf(document.activeElement);
    state.pane = p;
    if (p) state.lastPane = p;
    document.body.dataset.pane = p;
    chipTree.hidden = p !== 'tree';
    chipView.hidden = p !== 'viewer';
  }
  document.addEventListener('focus', syncPane, true);
  document.addEventListener('blur', () => setTimeout(syncPane, 0), true);

  function focusPane(p) {
    if (p === 'viewer') {
      if (viewer.hidden || !state.active) return false;
      viewer.focus({ preventScroll: true });
    } else {
      if (!state.root) return false;
      treeEl.focus({ preventScroll: true });
    }
    syncPane();
    return true;
  }

  // F6：在目錄與預覽區之間切換
  window.addEventListener('keydown', e => {
    if (e.key !== 'F6' || e.ctrlKey || e.altKey || e.metaKey) return;
    e.preventDefault();
    const cur = paneOf(document.activeElement) || state.lastPane;
    if (!focusPane(cur === 'tree' ? 'viewer' : 'tree')) focusPane('tree');
  });

  // 焦點掉到頁面空白處（例如點到標題列）時，方向鍵還是要有人接：交給最後操作的那一邊
  document.addEventListener('keydown', e => {
    if (e.defaultPrevented || e.ctrlKey || e.metaKey || e.altKey) return;
    const a = document.activeElement;
    if (a && a !== document.body && a !== document.documentElement) return;   // 焦點在某個元件（輸入框、對話框…）上，不攔
    if (!['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', 'PageUp', 'PageDown', 'Home', 'End', 'Enter'].includes(e.key)) return;
    const pane = state.lastPane === 'viewer' && !viewer.hidden && state.active ? 'viewer' : 'tree';
    if (!focusPane(pane)) return;
    e.preventDefault();
    if (pane === 'tree') treeKeydown(e); else viewerKeydown(e, true);
  });

  // 圖片 / PDF 檢視器自己載入時，不可以把焦點從目錄搶走（用方向鍵逛目錄時，每走到圖片焦點就被搶走）
  function keepPaneFocus(pane, shouldRestore) {
    if (pane !== 'tree') return;
    for (const ms of [0, 150, 500]) setTimeout(() => { if (shouldRestore() && paneOf(document.activeElement) === 'viewer') treeEl.focus({ preventScroll: true }); }, ms);
  }
  syncPane();

  // 主題切換：跟隨系統 → 淺色 → 深色
  const themeBtn = $('themeBtn');
  const THEME_KEY = 'viewer-theme';
  const MODES = ['system', 'light', 'dark'];
  const SVG = d => '<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">' + d + '</svg>';
  const THEME_ICON = {
    system: SVG('<rect x="1.75" y="2.5" width="12.5" height="8.5" rx="1.2"/><path d="M5.5 14h5M8 11v3"/>'),
    light: SVG('<circle cx="8" cy="8" r="2.8"/><path d="M8 1.5v1.6M8 12.9v1.6M1.5 8h1.6M12.9 8h1.6M3.4 3.4l1.1 1.1M11.5 11.5l1.1 1.1M12.6 3.4l-1.1 1.1M4.5 11.5l-1.1 1.1"/>'),
    dark: SVG('<path d="M13.2 9.6A5.6 5.6 0 0 1 6.4 2.8a5.6 5.6 0 1 0 6.8 6.8z"/>')
  };
  const THEME_LABEL = { system: '主題：跟隨系統', light: '主題：淺色', dark: '主題：深色' };
  let themeMode = 'system';
  try { const v = localStorage.getItem(THEME_KEY); if (MODES.includes(v)) themeMode = v; } catch (_) {}

  function applyTheme() {
    const root = document.documentElement;
    if (themeMode === 'system') root.removeAttribute('data-theme');
    else root.setAttribute('data-theme', themeMode);
    themeBtn.innerHTML = THEME_ICON[themeMode];
    themeBtn.title = THEME_LABEL[themeMode] + '（點擊切換）';
    themeBtn.setAttribute('aria-label', THEME_LABEL[themeMode]);
  }
  themeBtn.addEventListener('click', () => {
    themeMode = MODES[(MODES.indexOf(themeMode) + 1) % MODES.length];
    try {
      if (themeMode === 'system') localStorage.removeItem(THEME_KEY);
      else localStorage.setItem(THEME_KEY, themeMode);
    } catch (_) {}
    applyTheme();
  });
  applyTheme();

  // 調整側欄寬度
  const resizer = $('resizer');
  resizer.addEventListener('pointerdown', e => {
    resizer.setPointerCapture(e.pointerId);
    resizer.classList.add('drag');
    const move = ev => {
      const w = Math.min(Math.max(window.innerWidth - ev.clientX, 220), Math.floor(window.innerWidth * 0.6));
      document.documentElement.style.setProperty('--sidew', w + 'px');
    };
    const up = () => {
      resizer.classList.remove('drag');
      resizer.removeEventListener('pointermove', move);
      resizer.removeEventListener('pointerup', up);
    };
    resizer.addEventListener('pointermove', move);
    resizer.addEventListener('pointerup', up);
  });
})();
</script>
</body>
</html>
