    scheduleSessionSave();
    renderTabs();
    renderViewer();
    markTree();
  }

  const X_ICON = '<svg viewBox="0 0 10 10" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="M2 2l6 6M8 2L2 8"/></svg>';

  /* ---------- 所有分頁（下拉清單）：分頁太多時用 ---------- */
  const TM = { open: false, sel: 0, sort: (() => { try { return localStorage.getItem('viewer-tabmenu-sort') === 'mru' ? 'mru' : 'order'; } catch (_) { return 'order'; } })(), prevPane: 'tree', rows: [] };   // lsGet 要到後面才定義，這裡不能用
  const tabsRow = $('tabsRow'), tabsAll = $('tabsAll'), tmMenu = $('tabMenu'), tmInput = $('tmInput'), tmList = $('tmList'), tmCount = $('tmCount'), tmSort = $('tmSort');

  // 這個分頁目前被捲到分頁列的可見範圍之外嗎？
  function tabOffscreen(path) {
    const el = [...tabsEl.querySelectorAll('.tab')].find(e => e.dataset.path === path);
    if (!el) return false;
    const r = el.getBoundingClientRect(), c = tabsEl.getBoundingClientRect();
    return r.width > 0 && (r.left < c.left - 1 || r.right > c.right + 1);
  }
  function tmItems() {
    const q = tmInput.value.trim();
    const list = state.tabs.map((t, i) => ({ t, i }));
    if (!q) {
      if (TM.sort === 'mru') { const rank = p => { const k = state.mru.indexOf(p); return k < 0 ? 1e6 : k; }; list.sort((a, b) => rank(a.t.path) - rank(b.t.path) || a.i - b.i); }
      return list.map(x => ({ ...x, m: { idx: [] } }));
    }
    const out = [];
    for (const x of list) { const m = qoMatch(q, x.t.path); if (m) out.push({ ...x, m }); }   // 沿用 Ctrl+P 的比對：多個詞、模糊
    return out.sort((a, b) => b.m.score - a.m.score);
  }
  function tmRefresh() {
    const items = tmItems(), q = tmInput.value.trim();
    TM.rows = items;
    if (TM.sel >= items.length) TM.sel = Math.max(0, items.length - 1);
    tmList.textContent = '';
    tmCount.textContent = state.tabs.length + ' 個分頁' + (q ? '，符合 ' + items.length + ' 個' : '');
    tmSort.textContent = TM.sort === 'mru' ? '排序：最近使用' : '排序：開啟順序';
    tmSort.hidden = !!q;
    items.forEach((it, k) => {
      const row = elx('div', 'tm-item' + (k === TM.sel ? ' sel' : '') + (it.t.path === state.active ? ' active' : '') + (it.t.pinned ? '' : ' preview'));
      row.setAttribute('role', 'option');
      row.dataset.path = it.t.path;
      row.title = it.t.path;
      row.append(elx('span', 'tm-dot', it.t.path === state.active ? '●' : ''));
      const main = elx('span', 'tm-main');
      main.innerHTML = qoHtml(it.t.path, it.m.idx);
      row.append(main);
      if (!it.t.pinned) row.append(elx('span', 'tm-tag', '預覽'));
      if (state.notes[it.t.path]) { const n = elx('span', 'tm-note'); n.innerHTML = NOTE_SVG; n.title = '有備註'; row.append(n); }
      if (tabOffscreen(it.t.path)) row.append(elx('span', 'tm-tag off', '畫面外'));
      const x = elx('button', 'x'); x.type = 'button'; x.innerHTML = X_ICON; x.setAttribute('aria-label', '關閉分頁'); x.title = '關閉分頁';
      x.addEventListener('click', e => { e.stopPropagation(); closeTab(it.t.path); });   // closeTab 會重畫分頁列，連帶重畫這份清單

      row.addEventListener('click', () => { tmClose(true); activate(it.t.path, true); });

      row.addEventListener('mousedown', e => { if (e.button === 1) e.preventDefault(); });

      tmList.append(row);
    });
    if (!items.length) tmList.append(elx('div', 'tm-empty nb-muted', '沒有符合的分頁'));

  function tmOpen() {

    // 點按鈕時瀏覽器會先把焦點移到按鈕上，所以不能記「目前的焦點元素」；要記的是「最近在操作哪一邊」

    TM.open = true;
    tmMenu.hidden = false;
    tabsAll.setAttribute('aria-expanded', 'true');

    tmInput.focus();

  function tmClose(restoreFocus) {

    TM.open = false;
    tmMenu.hidden = true;

  }

  tmInput.addEventListener('input', () => { TM.sel = 0; tmRefresh(); });
  tmInput.addEventListener('keydown', e => {

      e.preventDefault();

    }

  document.addEventListener('mousedown', e => { if (TM.open && !tmMenu.contains(e.target) && !tabsAll.contains(e.target)) tmClose(false); });   // 點到別處就關掉，焦點留給使用者點的那個地方
  // 滑鼠停在分頁列上，滾輪左右移動（原本滾輪不會橫向捲動，分頁多時很難找）
  tabsEl.addEventListener('wheel', e => {
    if (e.ctrlKey || tabsEl.scrollWidth <= tabsEl.clientWidth) return;
    if (Math.abs(e.deltaY) <= Math.abs(e.deltaX)) return;
    tabsEl.scrollLeft += e.deltaMode === 1 ? e.deltaY * 16 : e.deltaY;
    e.preventDefault();
  }, { passive: false });

  function renderTabs() {
    tabsEl.hidden = state.tabs.length === 0;
    tabsRow.hidden = state.tabs.length === 0;
    $('tabsCount').textContent = String(state.tabs.length);
    if (TM.open) { if (!state.tabs.length) tmClose(false); else tmRefresh(); }
    tabsEl.textContent = '';
    const names = {};
    for (const t of state.tabs) names[base(t.path)] = (names[base(t.path)] || 0) + 1;

    for (const t of state.tabs) {
      const el = document.createElement('div');
      el.className = 'tab' + (t.path === state.active && !state.home ? ' active' : '') + (t.pinned ? '' : ' preview');
      el.setAttribute('role', 'tab');
      el.draggable = true;
      el.title = t.path;
      el.dataset.path = t.path;

      const nm = document.createElement('span');
      nm.className = 't-name';
      nm.textContent = base(t.path);
      el.append(nm);

      if (names[base(t.path)] > 1) {
        const d = document.createElement('span');
        d.className = 't-dir';
        const parent = dirOf(t.path);
        d.textContent = parent.slice(parent.lastIndexOf('/') + 1);
        el.append(d);
      }

      if (state.notes[t.path]) {
        const ni = document.createElement('span');
        ni.className = 't-note';
        ni.innerHTML = NOTE_SVG;
        ni.title = '有備註';
        el.append(ni);
      }

      const x = document.createElement('button');
      x.className = 'x';
      x.type = 'button';
      x.setAttribute('aria-label', '關閉分頁');
      x.innerHTML = X_ICON;
      x.addEventListener('click', e => { e.stopPropagation(); closeTab(t.path); });
      el.append(x);

      el.addEventListener('click', () => { if (t.path !== state.active) activate(t.path, true); });
      el.addEventListener('dblclick', () => { t.pinned = true; chgSeen(t.path); scheduleSessionSave(); renderTabs(); markTree(); });
      el.addEventListener('dragstart', e => {

      el.addEventListener('auxclick', e => { if (e.button === 1) { e.preventDefault(); closeTab(t.path); } });
      el.addEventListener('mousedown', e => { if (e.button === 1) e.preventDefault(); });
      tabsEl.append(el);
    }
    const act = tabsEl.querySelector('.tab.active');
    if (act) act.scrollIntoView({ block: 'nearest', inline: 'nearest' });
  }

  /* ---------- 分頁拖曳換位置 ---------- */
  state.dragTab = null;
  const clearDropMarks = () => tabsEl.querySelectorAll('.drop-before,.drop-after').forEach(e => e.classList.remove('drop-before', 'drop-after'));
  // 游標在第幾個分頁的「前面」：落在某個分頁的左半邊就插在它前面，右半邊就插在後面
  function dropIndexAt(clientX) {
    const els = [...tabsEl.querySelectorAll('.tab')];
    for (let i = 0; i < els.length; i++) {
      const r = els[i].getBoundingClientRect();

  }
  tabsEl.addEventListener('dragover', e => {
    if (!state.dragTab) return;

    e.dataTransfer.dropEffect = 'move';
    clearDropMarks();
    const els = [...tabsEl.querySelectorAll('.tab')];
    const i = dropIndexAt(e.clientX);
    if (i < els.length) els[i].classList.add('drop-before');
    else if (els.length) els[els.length - 1].classList.add('drop-after');

  tabsEl.addEventListener('drop', e => {
    if (!state.dragTab) return;
    e.preventDefault();
    e.stopPropagation();
    const from = state.tabs.findIndex(t => t.path === state.dragTab);
    let to = dropIndexAt(e.clientX);
    clearDropMarks();
    state.dragTab = null;
    if (from < 0) return;
    if (to > from) to--;   // 先把被拖的那個拿掉，它後面的位置會往前移一格

    state.tabs.splice(to, 0, moved);
    scheduleSessionSave();
    renderTabs();
  });

  /* ===================== 內容檢視 ===================== */
  let renderToken = 0;

  /* ===================== 事件 ===================== */
  treeEl.addEventListener('click', e => {
    const row = e.target.closest('.row');
    if (!row) return;
    const path = row.dataset.path;
    state.cursor = path;
    treeEl.focus({ preventScroll: true });

    }
  });

  treeEl.addEventListener('dblclick', e => {

  });

  function toggleDir(path) {
    if (state.filter.trim()) return;
    if (state.open.has(path)) state.open.delete(path); else state.open.add(path);
    renderTree();
  }

  function moveCursor(row) {
    state.cursor = row.dataset.path;

    else markTree();
    row.scrollIntoView({ block: 'nearest' });
  }

  function treeKeydown(e) {
    if (e.altKey || e.ctrlKey || e.metaKey) return;
    const rows = [...treeEl.querySelectorAll('.row')];
    if (!rows.length) return;
    const i = rows.findIndex(r => r.dataset.path === state.cursor);
    const go = idx => moveCursor(rows[Math.max(0, Math.min(rows.length - 1, idx))]);
    const cur = i >= 0 ? rows[i] : null;
    const filtering = !!state.filter.trim();

    switch (e.key) {
      case 'ArrowDown': e.preventDefault(); go(i < 0 ? 0 : i + 1); break;
      case 'ArrowUp': e.preventDefault(); go(i < 0 ? 0 : i - 1); break;
      case 'PageDown': e.preventDefault(); go(i < 0 ? 0 : i + 10); break;
      case 'PageUp': e.preventDefault(); go(i < 0 ? 0 : i - 10); break;

      case 'End': e.preventDefault(); go(rows.length - 1); break;

        for (let k = i - 1; k >= 0; k--) {

      }

  treeEl.addEventListener('keydown', treeKeydown);

  search.addEventListener('keydown', e => {
    if (e.key === 'ArrowDown') {
      e.preventDefault();
      treeEl.focus({ preventScroll: true });

  $('expandBtn').addEventListener('click', () => {

  });

  // 複製
  $('copyBtn').addEventListener('click', async () => {
    const info = state.active && state.cache.get(state.active);
    if (!info) return;
    const btn = $('copyBtn');
    let ok = false;
    try { await navigator.clipboard.writeText(info.text); ok = true; }
    catch (_) {
      const ta = document.createElement('textarea');

  window.addEventListener('dragleave', e => { e.preventDefault(); if (!isFileDrag(e)) return; if (--dragDepth <= 0) { dragDepth = 0; document.body.classList.remove('dragging'); } });
  window.addEventListener('dragover', e => e.preventDefault());
  window.addEventListener('drop', async e => {
    e.preventDefault();   // 不管拖進來什麼，都不讓瀏覽器跳去開它（會離開這個頁面）
    dragDepth = 0;
    document.body.classList.remove('dragging');
    if (!isFileDrag(e)) return;   // 分頁拖曳、拖進來的文字等：不是檔案，不處理
    const types = [...(e.dataTransfer.types || [])].join(',') || '無';
    const items = [...(e.dataTransfer.items || [])].filter(i => i.kind === 'file');

        '\n若來源是 WinSCP / MobaXterm / 遠端桌面這類「虛擬檔案」，請先下載到本機磁碟再拖，或改用「選擇資料夾」按鈕。', true);
      return;
    }

    const handleReqs = items.map(i =>

        : Promise.resolve(null));
    const entryList = items.map(i => (i.webkitGetAsEntry ? i.webkitGetAsEntry() : null));

    const skipped = [];

      const tmpSkipped = [];

      if (out.length === before && entryList[k]) await walk(entryList[k], '', out, skipped);
      else skipped.push(...tmpSkipped);
    }
    const hk = handles.map(h => (h ? h.kind : '無handle')).join(',');
    const ek = entryList.map(en => (en ? (en.isDirectory ? 'dir' : 'file') : '無entry')).join(',');
    notify('讀取結果：' + out.length + ' 個檔案，略過 ' + skipped.length + ' 個\nhandle: ' + hk + '  entry: ' + ek +
      '\n' + location.protocol + '//' + (location.host || '(本機檔案)') + '  secureContext=' + window.isSecureContext, out.length === 0);
    const unsup = out.filter(o => o.path.indexOf('/') === -1 && unsupportedArchive(o.file.name));
    if (unsup.length && unsup.length === out.length) {
      notify(unsup.map(o => unsupportedArchiveText(o.file.name, unsupportedArchive(o.file.name))).join('\n'), true);
      return;
    }
    const archives = out.filter(o => o.path.indexOf('/') === -1 && isArchiveName(o.file.name));
    if (archives.length && archives.length === out.length && archives.length === items.length) {
      // 有檔案憑證就一併帶過去，之後從「最近開啟」不用再重新拖
      loadArchives(archives.map(a => ({ file: a.file, handle: handles.find(h => h && h.kind === 'file' && h.name === a.file.name) || null })));
      return;
    }
    // 單一資料夾、或單一檔案（壓縮檔在上面處理過了）都保留憑證：之後從「最近開啟」進來讀的是硬碟上最新的那一份，也才比對得出變動
    const rootHandle = (items.length === 1 && handles[0] && (handles[0].kind === 'directory' || handles[0].kind === 'file')) ? handles[0] : null;
    loadEntries(out, skipped, rootHandle);
  });

  async function walkHandle(h, prefix, out, skipped) {
    try {
      if (h.kind === 'file') {
        const file = await h.getFile();
        out.push({ path: prefix + h.name, file });
      } else if (h.kind === 'directory') {
        if (IGNORE.has(h.name)) return;
        for await (const child of h.values()) {
          await walkHandle(child, prefix + h.name + '/', out, skipped);
        }
      }
    } catch (err) {
      const why = (err && (err.name || err.message)) || String(err);
      skipped.push(prefix + h.name + '  [' + why + ']');
      console.warn('略過無法讀取的項目:', prefix + h.name, err);
    }
  }

  async function walk(entry, prefix, out, skipped) {
    try {
      if (entry.isFile) {
        const file = await new Promise((res, rej) => entry.file(res, rej));
        out.push({ path: prefix + entry.name, file });
      } else if (entry.isDirectory) {
        if (IGNORE.has(entry.name)) return;
        const reader = entry.createReader();
        const all = [];
        for (;;) {
          const batch = await new Promise((res, rej) => reader.readEntries(res, rej));
          if (!batch.length) break;
          all.push(...batch);
        }
        for (const child of all) await walk(child, prefix + entry.name + '/', out, skipped);
      }
    } catch (err) {
      const why = (err && (err.name || err.message)) || String(err);
      skipped.push(prefix + entry.name + '  [' + why + ']');
      console.warn('略過無法讀取的項目:', prefix + entry.name, err);
    }
  }

  /* ===================== 資料夾快照（IndexedDB） =====================
     偏好（主題）存 localStorage；檔案內容存 IndexedDB。
     依最外層資料夾名稱分組：同名覆蓋，不同名各自獨立。 */
  const DB_NAME = 'yaml-tree-viewer', STORE = 'kv';
  const SNAP_LIMIT = 3 * 1024 * 1024;   // 單檔超過 3 MB 不存內容
  const MAX_GROUPS = 6;
  const recentEl = $('recent');
  let recents = [];
  let saveSeq = 0;

  function idbOpen() {
    return new Promise((res, rej) => {
      const r = indexedDB.open(DB_NAME, 1);
      r.onupgradeneeded = () => r.result.createObjectStore(STORE);
      r.onsuccess = () => res(r.result);
      r.onerror = () => rej(r.error);
    });
  }
  async function idbGet(key) {
    const db = await idbOpen();
    return new Promise((res, rej) => {
      const q = db.transaction(STORE).objectStore(STORE).get(key);
      q.onsuccess = () => res(q.result);
      q.onerror = () => rej(q.error);
    });
  }
  async function idbSet(key, val) {
    const db = await idbOpen();
    return new Promise((res, rej) => {
      const tx = db.transaction(STORE, 'readwrite');
      tx.objectStore(STORE).put(val, key);
      tx.oncomplete = () => res();
      tx.onerror = () => rej(tx.error);
      tx.onabort = () => rej(tx.error);
    });
  }
  async function idbDel(key) {
    const db = await idbOpen();
    return new Promise((res, rej) => {
      const tx = db.transaction(STORE, 'readwrite');
      tx.objectStore(STORE).delete(key);
      tx.oncomplete = () => res();
      tx.onerror = () => rej(tx.error);
    });
  }

  function groupKey() {
    const names = [...state.root.dirs.keys()].sort().concat(state.root.files.map(f => f.name).sort());
    return names.join(' + ') || '(未命名)';
  }

  function topNames() {
    let n = state.root;
    if (n.dirs.size === 1 && !n.files.length) n = [...n.dirs.values()][0];
    const names = [
      ...[...n.dirs.values()].sort(cmp).map(d => d.name + '/'),
      ...[...n.files].sort(cmp).map(f => f.name)
    ];
    return names.slice(0, 4).join(', ') + (names.length > 4 ? ' …' : '');
  }

  async function loadRecents() {
    try { recents = ((await idbGet('recents')) || []).map(r => ({ ...r, key: r.key || r.name })); }
    catch (_) { recents = []; }
    renderRecents();
  }

  async function upsertGroup(meta) {
    const list = recents.filter(r => r.key !== meta.key);
    list.unshift(meta);
    const dropped = list.slice(MAX_GROUPS);
    recents = list.slice(0, MAX_GROUPS);
    await idbSet('recents', recents);
    for (const d of dropped) { try { await idbDel('snap:' + d.key); } catch (_) {} }
    renderRecents();
  }

  // 把目前載入的資料夾記下來（同名組別會被覆蓋）。
  //   有授權憑證（拖曳、新式選擇器、新式檔案選擇器）：只記路徑、大小與修改時間；內容永遠讀硬碟上的實際檔案。
  //   沒有憑證（相容模式、一般檔案選擇器）：只能把文字內容存起來才打得開；圖片、PDF 與超過 3 MB 的檔案不存。
  async function saveGroup(rootHandle) {
    const seq = ++saveSeq;
    const key = groupKey(), hint = topNames(), files = new Map(state.files);
    const paths = [...files.keys()];
    const source = state.source || 'folder';
    if (state.chgReady) { try { await state.chgReady; } catch (_) {} if (seq !== saveSeq) return; }   // 要等「和上次比對」做完，才知道哪些檔案要記上標記
    const changeNote = state.changeNote || '';
    state.changeNote = '';
    const chg = new Map(state.chg), gone = state.chgGone.slice();
    try {
      let record;
      if (rootHandle) {
        record = {
          mode: 'index',
          files: paths.map(p => { const f = files.get(p); const r = { path: p, size: f.size, mtime: source === 'archive' ? null : f.lastModified }; if (chg.has(p)) r.ch = chg.get(p); return r; })
        };
        if (gone.length) record.gone = gone;
      } else {
        const out = new Array(paths.length);
        let done = 0;
        for (let i = 0; i < paths.length; i += 8) {
          const batch = paths.slice(i, i + 8);
          await Promise.all(batch.map(async (path, j) => {
            const file = files.get(path);
            if (file.size > SNAP_LIMIT) { out[i + j] = { path, size: file.size, binary: true, tooBig: true, text: null }; return; }
            if (MEDIA_EXT[extOf(path)]) { out[i + j] = { path, size: file.size, binary: true, tooBig: false, text: null }; return; }
            const r = await readFileText(file, '', null);
            out[i + j] = r.binary ? { path, size: file.size, binary: true, tooBig: false, text: null }
              : { path, size: file.size, binary: false, tooBig: false, text: r.text, enc: r.enc !== 'utf-8' ? r.enc : undefined, encGuessed: r.enc !== 'utf-8' ? r.guessed : undefined };
          }));
          done += batch.length;
          if (seq !== saveSeq) return;   // 中途又載入了別的資料夾，放棄這次保存
          notify('正在保存文字快照… ' + done + '/' + paths.length, true);
        }
        for (const o of out) { const f = files.get(o.path); o.mtime = f.lastModified; if (chg.has(o.path)) o.ch = chg.get(o.path); }   // 之後重新選擇同一個資料夾時才比得出變動
        record = { mode: 'text', files: out };
        if (gone.length) record.gone = gone;
      }
      await idbSet('snap:' + key, record);
      await upsertGroup({
        key, name: key, savedAt: Date.now(), count: paths.length, hint, hasSnapshot: true,
        handle: rootHandle || null, src: source, mode: record.mode
      });
      notify(rootHandle
        ? '已記住「' + key + '」的 ' + paths.length + ' 個檔案路徑。下次從「最近開啟」進來，只要授權一次，就會直接讀硬碟上最新的檔案。' + (changeNote ? '\n' + changeNote + (chg.size ? '目錄上已標出沒看過的變動。' : '') : '')
        : '已保存文字快照「' + key + '」（' + paths.length + ' 個檔案）。這個來源沒有授權憑證，所以只存文字內容，不含圖片、PDF、影音與超過 3 MB 的檔案。' + (changeNote ? '\n' + changeNote + (chg.size ? '目錄上已標出沒看過的變動。' : '') : ''));
    } catch (err) {
      notify('記住資料夾失敗：' + ((err && err.name) || err) + '\n（可能是瀏覽器儲存空間不足或被停用；目前仍可正常瀏覽，只是重新整理後不會保留。）', true);
    }
  }

  function renderRecents() {
    recentEl.textContent = '';
    if (!recents.length) { recentEl.hidden = true; return; }
    recentEl.hidden = false;
    const title = document.createElement('div');
    title.className = 'rc-title';
    title.textContent = '最近開啟（有授權憑證的，點選後授權一次就會讀硬碟上最新的檔案）';
    recentEl.append(title);
    const auto = document.createElement('label');
    auto.className = 'rc-auto nb-muted';
    const cb = document.createElement('input');
    cb.type = 'checkbox';
    cb.checked = lsGet('viewer-autoopen') !== '0';
    cb.addEventListener('change', () => lsSet('viewer-autoopen', cb.checked ? '1' : '0'));
    auto.append(cb, document.createTextNode(' 重新整理（F5）時，自動讀取上次的資料夾（瀏覽器還記得授權才會做）'));
    recentEl.append(auto);

    for (const r of recents) {
      const wrap = document.createElement('div');
      wrap.className = 'rc';

      const main = document.createElement('button');
      main.type = 'button';
      main.className = 'rc-main';
      const nm = document.createElement('span');
      nm.className = 'rc-name';
      nm.textContent = r.name;
      const meta = document.createElement('span');
      meta.className = 'rc-meta';
      meta.textContent = (r.src === 'archive' ? '壓縮檔 · ' : '') + r.count + ' 個檔案' + (r.hint ? ' · ' + r.hint : '') + ' · ' + new Date(r.savedAt).toLocaleString();
      main.title = r.name + '\n' + (r.hint || '') + '\n（瀏覽器不會提供完整路徑）';
      // 授權狀態：有憑證的，問瀏覽器現在還記不記得授權；沒有憑證的，說明只能開文字快照
      const perm = document.createElement('span');
      perm.className = 'rc-perm';
      if (r.handle) {
        perm.textContent = '確認授權狀態…';
        Promise.resolve().then(() => r.handle.queryPermission({ mode: 'read' })).then(p => {
          perm.dataset.state = p;
          perm.textContent = p === 'granted' ? '已授權，可以直接開啟' : p === 'denied' ? '授權已被拒絕（需要重新選擇）' : '開啟時需要授權一次';
        }).catch(() => { perm.dataset.state = 'invalid'; perm.textContent = '憑證已失效（需要重新選擇）'; });
      } else {
        perm.dataset.state = 'text';
        perm.textContent = '文字快照（沒有授權憑證，不含圖片、PDF 與影音）。重新拖入單一資料夾或單一檔案一次，就能直接讀最新的。';
      }
      main.append(nm, meta, perm);
      main.addEventListener('click', () => openRecent(r));
      wrap.append(main);

      const x = document.createElement('button');
      x.type = 'button';
      x.className = 'rc-x';
      x.title = '從清單移除（備註會保留）';
      x.setAttribute('aria-label', '移除');
      x.textContent = '✕';
      x.addEventListener('click', async () => {
        recents = recents.filter(v => v !== r);
        try { await idbSet('recents', recents); await idbDel('snap:' + r.key); } catch (_) {}
        renderRecents();
      });
      wrap.append(x);

      recentEl.append(wrap);
    }
  }

  // why：是因為什麼原因才改開文字快照（例如沒有取得授權）。有的話合成同一則訊息並且不自動消失，
  // 不然後面那則「已從快照開啟」會把原因蓋掉，使用者不知道自己看到的是舊資料
  function restoreSnapshot(r, snap, why) {
    const entries = snap.files.map(f => ({ path: f.path, file: new File([f.text || ''], base(f.path)) }));
    loadEntries(entries, [], null, { fromSnapshot: true, savedAt: r.savedAt, source: r.src });
    for (const f of snap.files) state.cache.set(f.path, Object.assign(analyze(f.path, f.text || '', f.size, f.binary, f.tooBig), f.enc ? { enc: f.enc, encGuessed: !!f.encGuessed, encFromSnapshot: true } : {}));
    state.chg = new Map(snap.files.filter(f => f.ch).map(f => [f.path, f.ch]));   // 當時記下、還沒看過的變動標記
    state.chgGone = (snap.gone || []).slice();
    markTree(); paintChgBar();
    state.chg = new Map(snap.files.filter(f => f.ch).map(f => [f.path, f.ch]));   // 之前偵測到、還沒看過的變動也要在
    state.chgGone = Array.isArray(snap.gone) ? snap.gone.slice() : [];
    state.chgLoadAt = 0;
    markTree();
    paintChgBar();
    notify((why ? why + '，改開舊的文字快照' : '已從文字快照開啟「' + r.name + '」（' + new Date(r.savedAt).toLocaleString() + '）') + '。這是複製的內容，不會跟著硬碟更新。\n要看到最新的內容與哪些檔案有變動，請重新選擇這個' + (r.src === 'archive' ? '壓縮檔' : '資料夾或檔案') + '（或拖進來）。', !!why);
  }

  async function readIndex(key) {
    try { const snap = await idbGet('snap:' + key); return snap && Array.isArray(snap.files) ? snap.files : null; }
    catch (_) { return null; }
  }

  // 讀不到原來的檔案時：如果有舊版留下的文字快照就改開它，沒有就請使用者重新選擇
  async function openTextFallback(r, why) {
    let snap = null;
    try { snap = await idbGet('snap:' + r.key); } catch (_) {}
    if (snap && snap.files && snap.mode !== 'index' && snap.files.some(f => typeof f.text === 'string')) {
      restoreSnapshot(r, snap, why);
      return;
    }
    notify(why + '。請重新選擇這個' + (r.src === 'archive' ? '壓縮檔' : '資料夾') + '。', true);
  }

  async function openRecent(r) {
    if (r.handle) { await reloadFromHandle(r); return; }
    try {
      const snap = await idbGet('snap:' + r.key);
      if (snap && snap.files && snap.mode !== 'index') { restoreSnapshot(r, snap); return; }
    } catch (_) {}
    notify('「' + r.name + '」沒有可以重新讀取的來源，請重新選擇這個' + (r.src === 'archive' ? '壓縮檔' : '資料夾') + '。', true);
  }

  // 有憑證的來源：讀硬碟上實際的檔案（必要時請瀏覽器跳出授權），並告訴使用者和上次比有哪些變動
  async function reloadFromHandle(r) {
    if (!r.handle) { await openTextFallback(r, '這一筆沒有授權憑證'); return; }
    let perm;
    try {
      perm = await r.handle.queryPermission({ mode: 'read' });
      if (perm !== 'granted') perm = await r.handle.requestPermission({ mode: 'read' });   // 要在使用者點擊後的短時間內呼叫，瀏覽器才肯跳出授權
    } catch (err) {
      await openTextFallback(r, '授權憑證已失效（' + ((err && err.name) || err) + '，資料夾可能被移動、改名或刪除）');
      return;
    }
    if (perm !== 'granted') { await openTextFallback(r, '沒有取得讀取權限'); return; }
    try {
      if (r.handle.kind === 'file' && r.src === 'archive') {   // 壓縮檔：重新讀取檔案並解開（一般檔案走下面的 walkHandle）
        const file = await r.handle.getFile();
        await loadArchives([{ file, handle: r.handle }]);
        return;
      }
      notify('讀取「' + r.name + '」中…', true);
      const out = [], skipped = [];
      await walkHandle(r.handle, '', out, skipped);
      if (!out.length) { await openTextFallback(r, '讀不到「' + r.name + '」裡的任何檔案（資料夾可能已被移動、改名或刪除）'); return; }
      loadEntries(out, skipped, r.handle);
    } catch (err) {
      await openTextFallback(r, '無法讀取「' + r.name + '」（' + ((err && err.name) || err) + '）');
    }
  }

  // 選擇資料夾：優先用 showDirectoryPicker（可保留資料夾憑證），失敗再退回相容模式
  async function pickFolder() {
    if (typeof window.showDirectoryPicker === 'function') {
      try {
        const h = await window.showDirectoryPicker({ mode: 'read' });
        notify('讀取「' + h.name + '」中…', true);
        const out = [], skipped = [];
        await walkHandle(h, '', out, skipped);
        loadEntries(out, skipped, h);
        return;
      } catch (err) {
        if (err && err.name === 'AbortError') return;   // 使用者取消
        notify('這個資料夾無法用新方式開啟（' + ((err && err.name) || err) + '，可能是系統保護的資料夾），改用相容模式。');
      }
    }
    picker.click();
  }

  // F5 / 重新整理之後：最近一筆有授權憑證、瀏覽器也還記得授權，就自動讀硬碟上最新的（不用再去點「最近開啟」），
  // 並且和上次比對、還原上次的分頁。授權過期時瀏覽器規定一定要使用者操作才能再授權，所以不會自動做，停在首頁等使用者點一下。
  async function autoOpenLast() {
    if (lsGet('viewer-autoopen') === '0' || state.root) return;
    const r = recents[0];
    if (!r || !r.handle) return;
    let perm;
    try { perm = await r.handle.queryPermission({ mode: 'read' }); } catch (_) { return; }
    if (perm !== 'granted' || state.root) return;
    await reloadFromHandle(r);
  }
  loadRecents().then(autoOpenLast);
  window.addEventListener('pagehide', () => { clearTimeout(sessionTimer); saveSession(); });   // 重新整理前，目前開著的分頁要存好，不然還原的會是舊的

  // 回到起始畫面：分頁、資料夾都留著，只是暫時顯示「選擇資料夾 / 最近開啟」。開任何檔案、點任何分頁、按 Esc 都會回去
  function goHome() {
    if (!state.root || state.home) return;
    clearTimeout(state.chgTimer);
    state.home = true;
    renderTabs();
    markTree();
    renderViewer();
  }
  function leaveHome() {
    if (!state.home) return;
    state.home = false;
    renderTabs();
    markTree();
    renderViewer();
    focusPane('tree');
  }
  $('homeBtn').addEventListener('click', () => { goHome(); });
  $('homeBackBtn').addEventListener('click', () => { leaveHome(); });
  window.addEventListener('keydown', e => {
    if (e.key !== 'Escape' || !state.home || e.defaultPrevented || e.ctrlKey || e.altKey || e.metaKey) return;
    const a = document.activeElement;
    if (a && /^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName)) return;   // 在輸入框裡按 Esc 是別的意思
    e.preventDefault();
    leaveHome();
  });

  // 側欄的「重新讀取」：不用重新整理頁面，直接讀硬碟上最新的（只有有授權憑證的來源）
  $('reloadBtn').addEventListener('click', async () => {
    if (!state.rootHandle) return;
    await saveSession();
    reloadFromHandle({ handle: state.rootHandle, key: groupKey(), name: groupKey(), src: state.source });
  });

  /* ===================== 檔案備註（IndexedDB，依資料夾分組） ===================== */
  const NOTE_SVG = '<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M3 2.5h10v8.5l-3 3H3z"/><path d="M10 14v-3h3M5.5 6h5M5.5 8.5h3"/></svg>';
  const notesEl = $('notes'), noteText = $('noteText'), noteMainBtn = $('noteMainBtn'), noteDelBtn = $('noteDelBtn');
  const notePreview = $('notePreview'), noteSaved = $('noteSaved');
  $('noteIcon').innerHTML = NOTE_SVG;
  let noteSaveTimer = null, notePending = null, savedTimer = null;

  const firstLine = t => t.trim().split('\n')[0].slice(0, 80);
  const noteOpen = path => (state.noteUI.has(path) ? state.noteUI.get(path) : !!state.notes[path]);

  function setSaved(msg) {
    noteSaved.textContent = msg;
    clearTimeout(savedTimer);
    if (msg) savedTimer = setTimeout(() => { noteSaved.textContent = ''; }, 1800);
  }

  async function persistNotes() {
    const key = state.noteKey;
    if (!key) return;
    const data = { ...state.notes };    // 同步取值，避免途中切換資料夾
    if (Object.keys(data).length) await idbSet('notes:' + key, data);
    else await idbDel('notes:' + key);
  }

  function renderNotes() {
    const path = state.active;
    if (!path || state.home) { notesEl.hidden = true; return; }   // 起始畫面沒有顯示任何檔案：備註列也不能出現（否則「添加備註」會加到看不到的檔案上）
    notesEl.hidden = false;
    const text = state.notes[path] || '';
    const has = !!text;
    const open = noteOpen(path);
    noteText.hidden = !open;

        const f = state.files.get(p);

        if (f && f.size <= FS_MAX_FILE) {
          try { const info = await getInfo(p); if (info && !info.binary) h = hashText(info.text); } catch (_) {}

        fp.set(p, h);
      }));
    }
    const push = (m, k, v) => { const a = m.get(k); if (a) a.push(v); else m.set(k, [v]); };
    for (const p of paths) {
      byRel.set(nbRel(state.noteKey, p), p);
      push(byName, base(p), p);
      if (fp.get(p)) push(byFp, fp.get(p), p);
    }
    return { byRel, byName, byFp, fp };

      pg.rows = pg.notes.map(n => rowFor(n, 'unverified', prefix + n.rel, [], stored));

    if (NB.tab === 'imp') nbRenderImport();
  }

  function nbImportCounts() {
    let n = 0;
    if (NB.imp && NB.imp.groups) NB.imp.groups.forEach(pg => pg.rows.forEach(r => { if (r.include && r.path && r.action !== 'skip') n++; }));
    return n;
  }

  function nbUpdateImportUi() {
    const n = nbImportCounts();
    const b = $('nbApply');
    if (b) { b.textContent = '匯入選取的 ' + n + ' 則'; b.disabled = n === 0 || NB.busy; }
  }

  function nbRenderImport() {
    nbBody.textContent = '';
    nbFoot.textContent = '';
    const imp = NB.imp;
    const top = nbEl('div', 'nb-top');
    const pickBtn = nbEl('button', 'btn primary', imp ? '重新選擇備註檔…' : '選擇備註檔（.json）…');
    pickBtn.type = 'button';
    pickBtn.addEventListener('click', () => nbFile.click());
    top.append(pickBtn, nbEl('span', 'nb-muted', imp ? imp.fileName : '請選擇之前用「匯出 JSON」存下的備註檔。'));
    nbBody.append(top);

    if (!imp) {
      nbBody.append(nbEl('div', 'nb-note',
        '匯入時會先列出每一則備註要掛到哪個檔案，讓你確認後才寫入。\n' +
        '辨認檔案的方式：先比對「資料夾內的相對路徑」，找不到再比對「檔案內容」（檔案搬位置或改名也認得出），最後才用檔名；有多個同名檔案時會請你選。'));
      return;
    }
    if (imp.error) { nbBody.append(nbEl('div', 'nb-error', imp.error)); return; }

    const cur = state.noteKey;
    imp.groups.forEach(pg => {
      const box = nbEl('div', 'nb-group');
      const head = nbEl('div', 'nb-ghead');
      head.append(nbEl('span', '', pg.name), nbEl('span', 'nb-muted', pg.notes.length + ' 則'));
      const sel = nbEl('select', 'nb-sel');
      const opts = [];
      if (cur) opts.push(['current', '匯入到目前開啟的資料夾「' + cur + '」']);
      if (pg.name !== cur) opts.push(['stored', '存到資料夾「' + pg.name + '」（目前未開啟）']);
      opts.push(['skip', '略過這個資料夾']);
      opts.forEach(([v, label]) => { const o = nbEl('option', '', label); o.value = v; sel.append(o); });
      sel.value = pg.target;
      sel.addEventListener('change', async () => {
        pg.target = sel.value;
        await nbBuildRows(pg, imp.idx);
        nbRenderImport();
      });
      head.append(sel);
      box.append(head);

      pg.rows.forEach(r => {
        const row = nbEl('div', 'nb-row');
        const cb = nbEl('input');
        cb.type = 'checkbox';
        cb.checked = r.include && !!r.path;
        cb.disabled = !r.path;
        cb.addEventListener('change', () => { r.include = cb.checked; nbUpdateImportUi(); });
        const main = nbEl('div', 'nb-main');
        main.append(nbEl('div', 'nb-path', r.note.rel));
        const sub = nbEl('div', 'nb-sub');
        const [label, kind] = NB_STATUS[r.status];
        sub.append(nbEl('span', 'nb-badge' + (kind ? ' ' + kind : ''), label));
        if (r.path && (r.status === 'moved' || r.status === 'samename' || r.status === 'ambiguous')) {
          sub.append(nbEl('span', 'nb-to', '→ ' + nbRel(cur || '', r.path)));
        }
        main.append(sub, nbEl('div', 'nb-prev', nbFirstLine(r.note.text)));
        row.append(cb, main);

        const ctl = nbEl('div', 'nb-ctl');
        if (r.status === 'ambiguous' || r.status === 'samename' && r.candidates.length) {
          const cs = nbEl('select', 'nb-sel');
          const o0 = nbEl('option', '', '（請選擇對應的檔案）'); o0.value = ''; cs.append(o0);
          r.candidates.forEach(p => { const o = nbEl('option', '', nbRel(cur, p)); o.value = p; cs.append(o); });
          cs.value = r.path || '';
          cs.addEventListener('change', () => {
            r.path = cs.value || null;
            r.existing = r.path ? (nbTargetNotes(pg)[r.path] || '') : '';
            r.action = r.existing ? (r.existing.trim() === r.note.text.trim() ? 'skip' : 'merge') : 'add';
            r.include = !!r.path && r.action !== 'skip';
            nbRenderImport();
          });
          ctl.append(cs);
        } else if (r.status === 'missing') {
          const ms = nbEl('select', 'nb-sel');
          [['', '略過這則'], ['keep', '仍用原路徑保存（之後有該檔案時會自動掛上）']].forEach(([v, l]) => { const o = nbEl('option', '', l); o.value = v; ms.append(o); });
          ms.value = r.path ? 'keep' : '';
          ms.addEventListener('change', () => {
            if (ms.value === 'keep') {
              r.path = (cur ? nbPrefix(cur) : '') + r.note.rel;
              r.existing = nbTargetNotes(pg)[r.path] || '';
              r.action = r.existing ? (r.existing.trim() === r.note.text.trim() ? 'skip' : 'merge') : 'add';
              r.include = r.action !== 'skip';
            } else { r.path = null; r.include = false; }
            nbRenderImport();
          });
          ctl.append(ms);
        }
        if (r.path && r.existing) {
          const as = nbEl('select', 'nb-sel');
          [['merge', '這個檔案已有備註：合併'], ['overwrite', '已有備註：用匯入的覆蓋'], ['skip', '已有備註：略過']].forEach(([v, l]) => { const o = nbEl('option', '', l); o.value = v; as.append(o); });
          as.value = r.action;
          as.addEventListener('change', () => { r.action = as.value; nbUpdateImportUi(); });
          ctl.append(as);
        }
        row.append(ctl);
        box.append(row);
      });
      nbBody.append(box);
    });

    const apply = nbEl('button', 'btn primary', '');
    apply.type = 'button';
    apply.id = 'nbApply';
    apply.addEventListener('click', nbApplyImport);
    nbFoot.append(apply);
    nbUpdateImportUi();
  }

  async function nbApplyImport() {
    if (NB.busy || !NB.imp || !NB.imp.groups) return;
    NB.busy = true;
    nbUpdateImportUi();
    let added = 0, overwritten = 0, merged = 0;
    try {
      await flushNote();
      for (const pg of NB.imp.groups) {
        if (pg.target === 'skip') continue;
        const rows = pg.rows.filter(r => r.include && r.path && r.action !== 'skip');
        if (!rows.length) continue;
        const target = nbTargetNotes(pg);
        for (const r of rows) {
          const ex = target[r.path] || '';
          if (r.action === 'overwrite' && ex) { target[r.path] = r.note.text; overwritten++; }
          else if (ex) { const m = nbMerge(ex, r.note.text); if (m !== ex) merged++; target[r.path] = m; }
          else { target[r.path] = r.note.text; added++; }
        }
        if (pg.target === 'current') await persistNotes();
        else await idbSet('notes:' + pg.name, pg.storedNotes);
      }
      markTree(); renderTabs(); renderNotes();
      const total = added + overwritten + merged;
      notify('已匯入 ' + total + ' 則備註（新增 ' + added + '、合併 ' + merged + '、覆蓋 ' + overwritten + '）');
      closeNb();
    } catch (err) {
      NB.busy = false;
      nbUpdateImportUi();
      notify('匯入失敗：' + ((err && err.message) || err), true);
      return;
    }
    NB.busy = false;
  }

  nbFile.addEventListener('change', () => {
    const f = nbFile.files && nbFile.files[0];
    if (f) nbLoadImportFile(f);
    try { nbFile.value = ''; } catch (_) {}
  });
  nbTabExp.addEventListener('click', () => nbSwitch('exp'));
  nbTabImp.addEventListener('click', () => nbSwitch('imp'));
  $('nbClose').addEventListener('click', closeNb);
  $('nbBtn').addEventListener('click', () => openNb('exp'));
  nbModal.addEventListener('click', e => { if (e.target === nbModal) closeNb(); });
  window.addEventListener('keydown', e => { if (e.key === 'Escape' && !nbModal.hidden) { e.preventDefault(); closeNb(); } });

  /* ===================== 檢視器核心：檢視模式、自動換行、字體大小 ===================== */
  const mdBtn = $('mdBtn');   // 「預覽 / 表格 / 樹狀 / 看原始碼」按鈕（各種檢視共用）
  const wrapBtn = $('wrapBtn'), zoomInBtn = $('zoomIn'), zoomOutBtn = $('zoomOut');
  const VIEW_KINDS = {};      // 檔案可切換的「另一種檢視」：kind -> { label, title, detect(info,path), render(path,info) -> boolean }
  const VIEW_ORDER = ['md', 'csv', 'json', 'svg', 'html'];
  const CODE_EXT = { prepare: [], mount: [] };   // 程式碼檢視的擴充點（例如日誌的篩選列）
  const WRAP_MAX_LINES = 20000;
  const ZOOM_MIN = 0.7, ZOOM_MAX = 2.2;

  const lsGet = k => { try { return localStorage.getItem(k); } catch (_) { return null; } };
  const lsSet = (k, v) => { try { localStorage.setItem(k, v); } catch (_) {} };

  state.viewMode = 'code';    // 目前實際顯示的是哪一種：code / md / csv / json / svg / media
  state.viewKind = null;      // 這個檔案「可以切換」的另一種檢視（沒有就是 null）
  state.keepLine = null;      // 重畫後要回到的行
  state.wrap = lsGet('viewer-wrap') === '1';
  state.zoom = Math.min(ZOOM_MAX, Math.max(ZOOM_MIN, parseFloat(lsGet('viewer-zoom')) || 1));
  state.viewPrefs = { md: lsGet('viewer-md-preview') === '1', csv: true, json: false, svg: true, html: false };
  try { Object.assign(state.viewPrefs, JSON.parse(lsGet('viewer-view-prefs') || '{}')); } catch (_) {}

  const saveViewPrefs = () => lsSet('viewer-view-prefs', JSON.stringify(state.viewPrefs));
  function applyZoom() {
    document.documentElement.style.setProperty('--zoom', String(state.zoom));
    zoomOutBtn.disabled = state.zoom <= ZOOM_MIN + 0.001;
    zoomInBtn.disabled = state.zoom >= ZOOM_MAX - 0.001;
    zoomOutBtn.title = zoomInBtn.title = '字體大小 ' + Math.round(state.zoom * 100) + '%';
  }
  applyZoom();

  function viewKindFor(info, path) {
    for (const k of VIEW_ORDER) if (VIEW_KINDS[k] && VIEW_KINDS[k].detect(info, path)) return k;
    return null;
  }

  // 工具列：換行只有程式碼檢視用得到；字體大小所有文字檢視都能用
  function setTools(wrap, zoom) {
    wrapBtn.hidden = !wrap;
    wrapBtn.classList.toggle('on', state.wrap);
    zoomOutBtn.hidden = zoomInBtn.hidden = !zoom;
  }

  /* ---------- 重畫 ---------- */
  async function renderViewer() {
    const token = ++renderToken;
    const path = state.active;
    const home = state.home && !!state.root;   // 起始畫面：分頁都還開著，只是暫時顯示「選擇資料夾 / 最近開啟」
    playerLeaving(home ? null : path);   // 正在播放的影音檔被切走：移到迷你播放器並詢問；沒在播放的直接釋放
    flushNote();
    renderNotes();
    mainEl.classList.toggle('no-file', !path || home);
    state.mdActive = false;
    state.viewMode = 'code';
    state.viewKind = null;
    if (state.htmlOpt.path && state.htmlOpt.path !== path) state.htmlOpt = { path: null, scripts: false, ext: 0 };   // 去看別的檔案就撤銷同意：回來要重新按
    revokeMdUrls();
    viewBar.hidden = true;
    viewBar.textContent = '';
    if (!path || home) {
      mdBtn.hidden = true;
      state.view = null;
      setTools(false, false);
      viewer.hidden = true;
      $('encBar').hidden = true;
      pathbar.hidden = true;
      emptyEl.hidden = FS.open;   // 搜尋面板開著時，面板就是主畫面
      const full = home || !state.root;   // 起始畫面（含從「首頁」按鈕回來的）要有完整的選擇功能；已經載入資料夾又沒開檔案時只提示一句
      emptyEl.querySelector('h1').textContent = full ? '拖曳資料夾或壓縮檔到這裡' : '選一個檔案開始';
      emptyEl.querySelector('p').innerHTML = full ? '支援資料夾，以及 .tgz / .tar.gz / .zip（不用先解壓）。<br>載入後在右側目錄單擊即可預覽，雙擊會開成分頁。' : '單擊右側檔案預覽，雙擊開成分頁。';
      emptyEl.querySelector('#pickBtn').hidden = !full;
      $('homeBack').hidden = !home;
      if (home) $('homeBackBtn').textContent = '↩ 回到「' + groupKey() + '」（' + state.tabs.length + ' 個分頁）';
      return;
    }
    $('homeBack').hidden = true;
    emptyEl.hidden = true;
    viewer.hidden = false;
    pathbar.hidden = false;
    const info = await getInfo(path);
    if (token !== renderToken) return;

    pathText.innerHTML = '<bdi>' + esc(path) + '</bdi>';
    paintEncBar(path, info);

    if (info.binary) { renderBinary(path, info); return; }
    $('copyBtn').hidden = !!info.partial;   // 只載入了開頭：複製會漏掉大部分內容，不提供

    const kind = info.partial ? null : viewKindFor(info, path);
    state.viewKind = kind;
    mdBtn.hidden = !kind;
    setTools(true, true);
    if (!kind && info.lang === 'md' && !state.mdLibNotified && (!libOk('marked') || !libOk('DOMPurify'))) {
      state.mdLibNotified = true;
      notify('Markdown 預覽需要 marked 與 DOMPurify：同一個資料夾找不到 marked.umd.js / purify.min.js，也無法載入線上版（可能沒有網路）。請連上網路後重新整理，或把檔案放在這個 HTML 的同一個資料夾（清單在空白首頁）。', true);
    }
    if (kind) {
      const spec = VIEW_KINDS[kind];
      // 從搜尋結果跳到某一行時一定要看原始碼（行號才有意義）
      const want = !!state.viewPrefs[kind] && !(FS.pending && FS.pending.path === path);
      mdBtn.textContent = want ? '看原始碼' : spec.label;
      mdBtn.title = want ? '切換成原始碼（有行號與語法高亮）' : spec.title;
      if (want && spec.render(path, info)) {
        state.viewMode = kind;
        state.keepLine = null;
        setTools(false, true);
        tagMeta(info);
        return;
      }
    }
    renderCode(path, info);
    tagMeta(info);
  }

  /* ---------- 文字編碼：說明列、手動切換、狀態列標示 ---------- */
  const encShort = e => encLabel(e).replace(/（.*$/, '').replace(/ \/ .*$/, '');
  function tagMeta(info) { if (!info.binary && info.enc) metaText.textContent += ' · ' + encShort(info.enc); }
  function paintEncBar(path, info) {
    const bar = $('encBar');
    bar.textContent = '';
    if (info.binary || info.media) { bar.hidden = true; return; }
    const enc = info.enc || 'utf-8', legacy = enc !== 'utf-8', msgs = [];
    if (info.partial) msgs.push('檔案太大（' + fmtSize(info.size) + '），沒有載入整個檔案，只顯示開頭的 ' + info.partial.lines + ' 行。');
    if (legacy) {
      if (info.encFromSnapshot) msgs.push('這個檔案原本是「' + encLabel(enc) + '」編碼（若直接用 UTF-8 讀取會變成亂碼）；快照已轉成可正常顯示的文字。');
      else if (info.encForced) msgs.push('你手動指定用「' + encLabel(enc) + '」顯示。');
      else if (enc.startsWith('utf-16')) msgs.push('這個檔案是 ' + encLabel(enc) + ' 編碼（' + (info.encBom ? '依檔案開頭的標記' : '依內容') + '判斷），已照該編碼顯示。');
      else msgs.push('這個檔案不是 UTF-8（若直接用 UTF-8 讀取，會變成亂碼）。已改用「' + encLabel(enc) + '」顯示。這是程式依內容判斷的，可能不準；判斷錯誤時請在右邊改選。');
    } else if (info.encForced) msgs.push('你手動指定用 UTF-8 顯示。');
    if (!msgs.length) { bar.hidden = true; return; }
    bar.append(elx('span', 'enc-msg', (legacy && info.encGuessed && !info.encForced && !info.encFromSnapshot ? '⚠ ' : '') + msgs.join(' ')));
    if (!info.encFromSnapshot) {   // 快照裡已經沒有原始位元組，不能再換編碼
      const sel = elx('select', 'nb-sel enc-sel');
      sel.title = '文字編碼';
      const auto = elx('option', '', '編碼：自動判斷'); auto.value = ''; sel.append(auto);
      TEXT_ENCODINGS.forEach(([v, l]) => { const o = elx('option', '', l); o.value = v; sel.append(o); });
      sel.value = info.encForced ? enc : '';
      sel.addEventListener('change', () => {
        if (sel.value) state.encForce.set(path, sel.value); else state.encForce.delete(path);
        state.cache.delete(path);
        renderViewer();
      });
      bar.append(sel);
    }
    bar.hidden = false;
  }

  // 圖片 / PDF / 其他二進位檔
  function renderBinary(path, info) {
    state.keepLine = null;
    mdBtn.hidden = true;
    state.view = null;
    setTools(false, false);
    $('copyBtn').hidden = true;
    metaText.textContent = fmtSize(info.size);
    if (typeof renderMedia === 'function' && renderMedia(path, info)) { state.viewMode = 'media'; return; }
    const unsupKind = unsupportedArchive(path);
    if (unsupKind) { viewer.textContent = ''; viewer.append(elx('div', 'notice', unsupportedArchiveText(base(path), unsupKind))); return; }
    if (info.tooLarge) { viewer.innerHTML = '<div class="notice">這個檔案太大（' + fmtSize(info.size) + '），不當成文字顯示。</div>'; return; }
    if (info.tooBig) { viewer.textContent = ''; viewer.append(snapshotNotice('超過 3 MB 的檔案內容')); return; }
    viewer.innerHTML = '<div class="notice">這看起來是二進位檔案（或讀取失敗），無法預覽。</div>';
  }

  // 程式碼檢視：有「雙欄 <pre>」（快、行號對齊）與「逐行元素」（自動換行 / 篩選後只顯示部分行）兩種版面
  function renderCode(path, info) {
    const langLabel = (LANG_LABEL[info.lang] || '純文字') + (info.auto ? '（自動偵測）' : '');
    let lines;
    try {
      lines = (info.text.length > (info.lang === 'log' ? 3000000 : HIGHLIGHT_LIMIT) || info.lang === 'text')
        ? plainLines(info.text)
        : highlightLines(info.lang, info.text);
    } catch (err) {
      console.warn('語法高亮失敗，改用純文字:', err);
      lines = plainLines(info.text);
    }
    // 結尾換行不要多出一個空行
    const raw = info.text.replace(/\r\n?/g, '\n').split('\n');
    if (lines.length > 1 && lines[lines.length - 1] === '') { lines.pop(); raw.pop(); }
    const v = state.view = { path, lines, raw: raw.length === lines.length ? raw : null, layout: 'pre', rows: null, lang: info.lang, wrap: false };
    CODE_EXT.prepare.forEach(h => h(v, info));

    let wrap = state.wrap;
    if (wrap && lines.length > WRAP_MAX_LINES) {
      wrap = false;
      if (!state.wrapWarned) { state.wrapWarned = true; notify('檔案超過 ' + WRAP_MAX_LINES + ' 行，這種大檔案不使用自動換行。'); }
    }
    v.wrap = wrap;
    if (v.rows && v.rows.length > WRAP_MAX_LINES) { v.rows = v.rows.slice(0, WRAP_MAX_LINES); v.rowsTruncated = true; }
    v.layout = wrap || v.rows ? 'rows' : 'pre';

    metaText.textContent = langLabel + ' · ' + (info.partial ? '前 ' + lines.length + ' 行（檔案共 ' + fmtSize(info.size) + '）' : lines.length + ' 行 · ' + fmtSize(info.size));
    buildShell(v);
    viewer.scrollTop = 0;
    viewer.scrollLeft = 0;
    CODE_EXT.mount.forEach(h => h(v, info));
    paintBody();   // 內容與搜尋命中標記
    if (FS.pending && FS.pending.path === path) {
      scrollToLine(FS.pending.line, FS.pending.col);
      FS.pending = null;
    } else if (state.keepLine != null) {
      scrollToLine(state.keepLine, 0, 'top');
    }
    state.keepLine = null;
  }

  function buildShell(v) {
    if (v.layout === 'rows') {
      viewer.innerHTML = '<div class="code rows' + (v.wrap ? ' wrap' : '') + '"><div class="rws"></div></div>';
    } else {
      const nums = [];
      for (let i = 1; i <= v.lines.length; i++) nums.push(i);
      viewer.innerHTML = '<div class="code"><pre class="gutter">' + nums.join('\n') + '</pre><pre class="body"></pre></div>';
    }
  }

  /* ---------- 內容、目前行、捲動 ---------- */
  function paintBody() {
    if (state.viewMode === 'md' && !viewer.hidden) { paintMd(); return; }
    const v = state.view;
    if (state.viewMode !== 'code' || !v || viewer.hidden) return;
    const scan = FS.open && FS.matcher && v.raw ? getScan(v.path, v.raw) : null;
    const lineHtml = i => {
      const h = v.lines[i];
      const hit = scan && scan.hmap.get(i);
      return hit ? markHtml(h, hit.ranges) : h;
    };
    if (v.layout === 'rows') {
      const box = viewer.querySelector('.rws');
      if (!box) return;
      const idx = v.rows || v.lines.map((_, i) => i);
      box.style.setProperty('--nw', (String(v.lines.length).length + 1) + 'ch');
      box.innerHTML = idx.length
        ? idx.map(i => '<div class="ln" data-i="' + i + '"><span class="no">' + (i + 1) + '</span><span class="tx">' + (lineHtml(i) || '&#8203;') + '</span></div>').join('') +
          (v.rowsTruncated ? '<div class="sg-more">只顯示前 ' + WRAP_MAX_LINES + ' 行，請加入篩選條件縮小範圍。</div>' : '')
        : '<div class="fs-empty">沒有符合條件的行。</div>';
    } else {
      const body = viewer.querySelector('.body');
      if (!body) return;
      body.innerHTML = scan && scan.hits.length ? v.lines.map((h, i) => lineHtml(i)).join('\n') : v.lines.join('\n');
    }
    placeCurLine();
  }

  function placeCurLine() {
    viewer.querySelectorAll('.curline').forEach(e => e.remove());
    viewer.querySelectorAll('.ln.cur').forEach(e => e.classList.remove('cur'));
    const v = state.view, cl = FS.curLine;
    if (!v || state.viewMode !== 'code' || !cl || cl.path !== v.path || !v.lines.length) return;
    if (v.layout === 'rows') {
      const row = viewer.querySelector('.ln[data-i="' + cl.line + '"]');
      if (row) row.classList.add('cur');
      return;
    }
    const code = viewer.querySelector('.code'), body = viewer.querySelector('.body');
    if (!code || !body) return;
    const lh = body.offsetHeight / v.lines.length;
    const el = document.createElement('div');
    el.className = 'curline';
    el.style.top = (parseFloat(getComputedStyle(code).paddingTop) + cl.line * lh) + 'px';
    el.style.height = lh + 'px';
    code.append(el);
  }

  function scrollToLine(line, col, align) {
    const v = state.view;
    if (!v || state.viewMode !== 'code' || !v.lines.length) return;
    const frac = align === 'top' ? 0 : 1 / 3;
    if (v.layout === 'rows') {
      const row = viewer.querySelector('.ln[data-i="' + line + '"]');
      if (!row) return;
      viewer.scrollTop = Math.max(0, row.getBoundingClientRect().top - viewer.getBoundingClientRect().top + viewer.scrollTop - viewer.clientHeight * frac);
      return;
    }
    const body = viewer.querySelector('.body'), code = viewer.querySelector('.code');
    if (!body || !code) return;
    const lh = body.offsetHeight / v.lines.length;
    viewer.scrollTop = Math.max(0, parseFloat(getComputedStyle(code).paddingTop) + line * lh - viewer.clientHeight * frac);
    // 命中在很右邊時，水平也捲過去
    const probe = document.createElement('span');
    probe.style.cssText = 'position:absolute;visibility:hidden;white-space:pre';
    probe.textContent = '0'.repeat(50);
    body.append(probe);
    const cw = probe.getBoundingClientRect().width / 50 || 8;
    probe.remove();
    const gutter = viewer.querySelector('.gutter');
    const x = (gutter ? gutter.offsetWidth : 0) + 16 + (col || 0) * cw;
    viewer.scrollLeft = x > viewer.clientWidth - 120 ? Math.max(0, x - viewer.clientWidth / 2) : 0;
  }

  // 目前畫面最上面是第幾行（0 起算）
  function topLine() {
    const v = state.view;
    if (!v || state.viewMode !== 'code') return 0;
    if (v.layout === 'rows') {
      const top = viewer.getBoundingClientRect().top;
      for (const r of viewer.querySelectorAll('.ln')) if (r.getBoundingClientRect().bottom > top + 1) return +r.dataset.i;
      return 0;
    }
    const body = viewer.querySelector('.body');
    const lh = body ? body.offsetHeight / v.lines.length : 0;
    return lh ? Math.max(0, Math.floor(viewer.scrollTop / lh)) : 0;
  }

  // 點到的是哪一行
  function lineFromEvent(e) {
    const v = state.view;
    if (!v) return -1;
    if (v.layout === 'rows') {
      const r = e.target.closest && e.target.closest('.ln');
      return r ? +r.dataset.i : -1;
    }
    const body = viewer.querySelector('.body');
    if (!body || !e.target.closest || !e.target.closest('.code')) return -1;
    const lh = body.offsetHeight / v.lines.length || 1;
    const idx = Math.floor((e.clientY - body.getBoundingClientRect().top) / lh);
    return idx >= 0 && idx < v.lines.length ? idx : -1;
  }

  const CLICK_HOOKS = [];   // (行號, 事件) => void；YAML 路徑、Helm 跳轉等會掛在這裡
  viewer.addEventListener('click', e => {
    if (state.viewMode !== 'code' || !state.view) return;
    const sel = window.getSelection ? window.getSelection() : null;
    if (sel && !sel.isCollapsed && String(sel).length > 0) return;   // 正在選取文字，不要打斷
    const i = lineFromEvent(e);
    if (i < 0) return;
    FS.curLine = { path: state.view.path, line: i };
    placeCurLine();
    CLICK_HOOKS.forEach(h => h(i, e));
  });

  /* ---------- 工具列 ---------- */
  mdBtn.addEventListener('click', () => {
    const kind = state.viewKind;
    if (!kind) return;
    state.viewPrefs[kind] = state.viewMode !== kind;   // 正在看另一種檢視 → 切回原始碼，反之亦然
    saveViewPrefs();
    renderViewer();
  });

  wrapBtn.addEventListener('click', () => {
    state.wrap = !state.wrap;
    lsSet('viewer-wrap', state.wrap ? '1' : '0');
    state.keepLine = topLine();
    renderViewer();
  });

  function setZoom(z) {
    state.zoom = Math.min(ZOOM_MAX, Math.max(ZOOM_MIN, Math.round(z * 10) / 10));
    lsSet('viewer-zoom', String(state.zoom));
    applyZoom();
    placeCurLine();   // 行高變了，目前行的標示要重新定位
  }
  zoomInBtn.addEventListener('click', () => setZoom(state.zoom + 0.1));
  zoomOutBtn.addEventListener('click', () => setZoom(state.zoom - 0.1));

  /* ===================== 第三方套件（和這個 HTML 放在同一個資料夾） ===================== */
  const LIBS = [
    { global: 'marked', file: 'marked.umd.js', need: 'Markdown 預覽', url: 'https://cdn.jsdelivr.net/npm/marked@18.1.0/lib/marked.umd.js' },
    { global: 'DOMPurify', file: 'purify.min.js', need: 'Markdown 預覽（安全消毒）', url: 'https://cdn.jsdelivr.net/npm/dompurify@3.4.16/dist/purify.min.js' },
    { global: 'fflate', file: 'fflate.umd.js', need: '拖入 .tgz / .zip 壓縮檔', url: 'https://cdn.jsdelivr.net/npm/fflate@0.8.3/umd/index.js' }
  ];
  const libOk = g => typeof window[g] !== 'undefined' && window[g] !== null;
  const missingLibs = () => LIBS.filter(l => !libOk(l.global));
  const libLine = l => l.file + '（' + l.need + '）';

  const libLinks = list => '<ul>' + list.map(l => '<li><b>' + esc(l.file) + '</b>（' + esc(l.need) + '）<br><a href="' + l.url + '" target="_blank" rel="noopener noreferrer">' + l.url + '</a></li>').join('') + '</ul>';
  function renderLibWarn() {
    const el = $('libWarn');
    const m = missingLibs();
    const cdn = LIBS.filter(l => libOk(l.global) && (window.__libFrom || {})[l.global] === 'cdn');
    el.hidden = !m.length && !cdn.length;
    el.classList.toggle('info', !m.length);   // 只是改用了線上版：用一般提示的樣式；有東西載入失敗才用警告樣式
    if (el.hidden) return;
    let html = '';
    if (m.length) html += '<b>有 ' + m.length + ' 個元件載入失敗</b>：同一個資料夾找不到，也無法載入線上版（可能沒有網路，或網路擋住了 cdn.jsdelivr.net）。對應的功能暫時不能用，其他功能不受影響。<br>請連上網路後重新整理頁面，或把下列檔案下載後，和這個 HTML 放在<b>同一個資料夾</b>：' + libLinks(m);
    if (cdn.length) html += (m.length ? '<br>' : '') + '<b>已改用線上版：</b>' + cdn.map(l => esc(l.file)).join('、') + '（同一個資料夾找不到）。要離線使用，請下載後放在這個 HTML 的同一個資料夾：' + libLinks(cdn);
    el.innerHTML = html;
  }
  renderLibWarn();

  /* ===================== Markdown 預覽（marked 轉換 + DOMPurify 消毒；套件放在同一個資料夾） ===================== */
  const MD_IMG_MIME = { png: 'image/png', jpg: 'image/jpeg', jpeg: 'image/jpeg', gif: 'image/gif', webp: 'image/webp', svg: 'image/svg+xml', bmp: 'image/bmp', ico: 'image/x-icon', avif: 'image/avif' };
  const MD_SPOOF = ['data-src', 'data-kind', 'data-rel', 'data-anchor', 'data-open'];   // 這些是我們自己加的，不信任來源文件寫的
  let mdSeen = new Map();
  let mdEngineInst = null;
  let mdPurifyReady = false;

  state.mdActive = false;     // 目前預覽區是不是正在顯示 Markdown 預覽
  state.mdHtml = '';
  state.mdPath = null;
  state.mdUrls = [];          // 資料夾內圖片的 blob 網址，切換時要釋放
  state.mdRemoteFor = null;   // 使用者同意載入外部圖片的「那一個檔案」；同意只對該檔案有效，換檔案要重新同意

  const mdAttr = s => esc(s).replace(/"/g, '&quot;');
  const mdPlain = html => html.replace(/<[^>]*>/g, '').replace(/&lt;/g, '<').replace(/&gt;/g, '>').replace(/&quot;/g, '"').replace(/&amp;/g, '&');

  // 標題 id：小寫、去標點、空白變 -，重複的加 -1、-2（和 GitHub 的規則類似）
  function mdSlug(text, seen) {
    let s = text.toLowerCase().replace(/[^\p{L}\p{N}\s_-]/gu, '').trim().replace(/\s+/g, '-');
    if (!s) s = 'section';
    const n = seen.get(s) || 0;
    seen.set(s, n + 1);
    return n ? s + '-' + n : s;
  }

  // 連結類型：anchor（頁內）/ ext（外部）/ rel（資料夾內相對路徑）/ data（內嵌圖片）/ bad（不安全，丟棄）
  function mdClassifyUrl(u) {
    const url = (u || '').trim();
    const probe = url.replace(/[\u0000-\u001f\u007f\s]+/g, '');
    if (!probe) return { type: 'bad' };
    if (probe[0] === '#') return { type: 'anchor', url };
    const m = /^([a-z][a-z0-9+.-]*):/i.exec(probe);
    if (m) {
      const s = m[1].toLowerCase();
      if (s === 'http' || s === 'https' || s === 'mailto' || s === 'tel') return { type: 'ext', url };
      if (s === 'data' && /^data:image\/(?:png|jpe?g|gif|webp|bmp|avif);base64,[a-z0-9+\/=]+$/i.test(probe)) return { type: 'data', url: probe };
      return { type: 'bad' };
    }
    if (probe.startsWith('//')) return { type: 'bad' };
    return { type: 'rel', url };
  }

  const MD_LANG = {
    yaml: 'yaml', yml: 'yaml', js: 'js', javascript: 'js', jsx: 'js', mjs: 'js', ts: 'ts', typescript: 'ts', tsx: 'ts',
    json: 'json', jsonc: 'json', css: 'css', scss: 'scss', less: 'scss', html: 'html', xml: 'xml', svg: 'xml', vue: 'html',
    sh: 'sh', bash: 'sh', shell: 'sh', zsh: 'sh', console: 'sh', python: 'py', py: 'py', cs: 'cs', csharp: 'cs', java: 'java',
    go: 'go', golang: 'go', c: 'c', cpp: 'c', 'c++': 'c', h: 'c', sql: 'sql', md: 'md', markdown: 'md', ini: 'ini', toml: 'ini',
    dockerfile: 'docker', docker: 'docker', tpl: 'tpl', gotmpl: 'tpl'
  };

  // 程式碼區塊：認得的語言沿用檢視器自己的語法高亮
  function mdCode(info, code) {
    const l = (info || '').trim().split(/\s+/)[0].toLowerCase();
    const lang = MD_LANG[l];
    let inner;
    try { inner = lang && code.length < 200000 ? highlightLines(lang, code).join('\n') : esc(code); }
    catch (_) { inner = esc(code); }
    return '<pre class="md-pre"' + (l ? ' data-lang="' + mdAttr(l.replace(/[^\w+#.-]/g, '')) + '"' : '') + '><code>' + inner + '</code></pre>';
  }

  function mdEngine() {
    if (mdEngineInst) return mdEngineInst;
    mdEngineInst = new marked.Marked({
      gfm: true,
      breaks: false,
      renderer: {
        heading({ tokens, depth }) {
          const inline = this.parser.parseInline(tokens);
          return '<h' + depth + ' id="' + mdAttr(mdSlug(mdPlain(inline), mdSeen)) + '">' + inline + '</h' + depth + '>\n';
        },
        code({ text, lang }) { return mdCode(lang, text) + '\n'; }
      }
    });
    return mdEngineInst;
  }

  function mdSetupPurify() {
    if (mdPurifyReady) return;
    mdPurifyReady = true;
    DOMPurify.addHook('afterSanitizeAttributes', node => {
      if (!node.tagName) return;
      const tag = node.tagName.toLowerCase();
      const href = node.getAttribute('href'), src = node.getAttribute('src');
      MD_SPOOF.forEach(k => node.removeAttribute(k));
      node.removeAttribute('name');   // 避免 DOM clobbering
      const id = node.getAttribute('id');
      if (id && !id.startsWith('md-')) node.setAttribute('id', 'md-' + id);
      if (tag === 'a') {
        if (href !== null) {
          const c = mdClassifyUrl(href);
          if (c.type === 'anchor') { node.setAttribute('href', '#'); node.setAttribute('data-anchor', c.url.slice(1)); }
          else if (c.type === 'ext') { node.setAttribute('target', '_blank'); node.setAttribute('rel', 'noopener noreferrer'); }
          else if (c.type === 'rel') { node.setAttribute('href', '#'); node.setAttribute('data-rel', c.url); }
          else node.removeAttribute('href');
        }
      } else if (tag === 'img') {
        // 絕不直接保留 src：否則一塞進頁面，瀏覽器就會立刻去載入（包含外部網站）
        node.removeAttribute('src');
        if (src !== null) {
          const c = mdClassifyUrl(src);
          if (c.type === 'rel' || c.type === 'data' || (c.type === 'ext' && /^https?:/i.test(c.url))) {
            node.setAttribute('data-src', c.url);
            node.setAttribute('data-kind', c.type);
          }
        }
      } else if (tag === 'input') {
        node.setAttribute('type', 'checkbox');
        node.setAttribute('disabled', '');
      }
    });
  }

  const MD_PURIFY = {
    USE_PROFILES: { html: true },
    FORBID_TAGS: ['style', 'form', 'textarea', 'select', 'option', 'button', 'svg', 'math', 'iframe', 'object', 'embed', 'link', 'meta', 'base', 'audio', 'video', 'source', 'track', 'canvas', 'dialog'],
    FORBID_ATTR: ['style', 'srcset', 'sizes', 'ping', 'autofocus', 'formaction', 'action'],
    ALLOW_DATA_ATTR: true
  };

  // Markdown 文字 -> 已消毒的 HTML 字串
  function mdToSafeHtml(text) {
    mdSetupPurify();
    mdSeen = new Map();
    let src = text.replace(/\r\n?/g, '\n'), front = '';
    const fm = /^---\n([\s\S]*?)\n(?:---|\.\.\.)[ \t]*(?:\n|$)/.exec(src);
    if (fm && /^[\w-]+\s*:/m.test(fm[1]) && fm[0].split('\n').length < 200) {
      front = '<details class="md-front"><summary>Front matter</summary>' + mdCode('yaml', fm[1]) + '</details>';
      src = src.slice(fm[0].length);
    }
    return DOMPurify.sanitize(front + mdEngine().parse(src), MD_PURIFY);
  }

  // 相對路徑 -> 資料夾內的實際檔案路徑（找不到回傳 null）
  function mdResolvePath(fromPath, rel) {
    let r = rel.split('#')[0].split('?')[0];
    try { r = decodeURIComponent(r); } catch (_) {}
    if (!r) return null;
    const dir = fromPath.indexOf('/') === -1 ? [] : fromPath.slice(0, fromPath.lastIndexOf('/')).split('/');
    const parts = r.startsWith('/') ? [fromPath.split('/')[0]].concat(r.slice(1).split('/')) : dir.concat(r.split('/'));
    const out = [];
    for (const seg of parts) {
      if (seg === '' || seg === '.') continue;
      if (seg === '..') { if (!out.length) return null; out.pop(); } else out.push(seg);
    }
    const p = out.join('/');
    if (state.files.has(p)) return p;
    const low = p.toLowerCase();
    for (const k of state.files.keys()) if (k.toLowerCase() === low) return k;
    return null;
  }

  function revokeMdUrls() {
    state.mdUrls.forEach(u => { try { URL.revokeObjectURL(u); } catch (_) {} });
    state.mdUrls = [];
  }

  // 把消毒後的 HTML 放進頁面後的收尾：提示框、檔案連結、圖片
  function mdResolve(root, path) {
    revokeMdUrls();
    // GitHub 風格提示框：> [!NOTE]
    root.querySelectorAll('blockquote').forEach(bq => {
      const p = bq.firstElementChild;
      if (!p || p.tagName !== 'P') return;
      const m = /^\s*\[!(NOTE|TIP|IMPORTANT|WARNING|CAUTION)\]\s*/i.exec(p.textContent);
      if (!m) return;
      const first = document.createTreeWalker(p, NodeFilter.SHOW_TEXT).nextNode();
      if (first) first.nodeValue = first.nodeValue.replace(/^\s*\[![A-Za-z]+\]\s*/, '');
      const kind = m[1].toLowerCase();
      const box = document.createElement('div');
      box.className = 'md-alert md-alert-' + kind;
      const title = document.createElement('p');
      title.className = 'md-alert-title';
      title.textContent = kind[0].toUpperCase() + kind.slice(1);
      box.append(title);
      while (bq.firstChild) box.append(bq.firstChild);
      if (!p.textContent.trim() && !p.querySelector('img')) p.remove();
      bq.replaceWith(box);
    });
    // 資料夾內的連結：之後點下去直接在檢視器開啟那個檔案
    root.querySelectorAll('a[data-rel]').forEach(a => {
      const target = mdResolvePath(path, a.getAttribute('data-rel'));
      if (target) { a.setAttribute('data-open', target); a.classList.add('md-file'); a.title = target; }
      else { a.classList.add('md-dead'); a.title = '找不到這個檔案：' + a.getAttribute('data-rel'); }
    });
    // 圖片
    let blocked = 0;
    root.querySelectorAll('img[data-src]').forEach(img => {
      const kind = img.getAttribute('data-kind'), src = img.getAttribute('data-src');
      const alt = img.getAttribute('alt') || '圖片';
      const placeholder = text => {
        const s = document.createElement('span');
        s.className = 'md-img-ph';
        s.textContent = '[圖片] ' + text;
        s.title = src;
        img.replaceWith(s);
      };
      if (kind === 'data') img.setAttribute('src', src);
      else if (kind === 'ext') {
        if (state.mdRemoteFor === path) { img.setAttribute('referrerpolicy', 'no-referrer'); img.setAttribute('loading', 'lazy'); img.setAttribute('src', src); }
        else { blocked++; placeholder(alt + '（外部圖片未載入）'); }
      } else {
        const p = mdResolvePath(path, src);
        const mime = p ? MD_IMG_MIME[extOf(p)] : '';
        if (!p || !mime) placeholder(alt + '（找不到圖片：' + src + '）');
        else if (state.fromSnapshot) placeholder(alt + '（文字快照不含圖片，請重新選擇資料夾）');
        else {
          const url = URL.createObjectURL(new Blob([state.files.get(p)], { type: mime }));
          state.mdUrls.push(url);
          img.setAttribute('src', url);
        }
      }
    });
    if (blocked) {
      const n = document.createElement('div');
      n.className = 'md-notice';
      n.append(document.createTextNode('有 ' + blocked + ' 張外部圖片沒有載入（避免連線到外部網站）。 '));
      const b = document.createElement('button');
      b.type = 'button';
      b.className = 'btn md-load-remote';
      b.textContent = '載入外部圖片';
      n.append(b);
      root.prepend(n);
    }
  }

  // 搜尋面板開著時，預覽裡的關鍵字也標出來
  function mdMarkTerms(root) {
    const walker = document.createTreeWalker(root, NodeFilter.SHOW_TEXT);
    const nodes = [];
    while (walker.nextNode()) nodes.push(walker.currentNode);
    for (const tn of nodes) {
      const t = tn.nodeValue;
      const r = FS.matcher.matchExact(t);
      if (!r) continue;
      const frag = document.createDocumentFragment();
      let pos = 0;
      for (const [s, e] of r.ranges) {
        if (s > pos) frag.append(t.slice(pos, s));
        const mk = document.createElement('mark');
        mk.className = 'hit';
        mk.textContent = t.slice(s, e);
        frag.append(mk);
        pos = e;
      }
      if (pos < t.length) frag.append(t.slice(pos));
      tn.replaceWith(frag);
    }
  }

  function paintMd() {
    const root = viewer.querySelector('.md');
    if (!root) return;
    revokeMdUrls();
    root.innerHTML = state.mdHtml;
    mdResolve(root, state.mdPath);
    if (FS.open && FS.matcher) mdMarkTerms(root);
  }

  // 顯示預覽；失敗回傳 false，讓呼叫端退回原始碼檢視
  function renderMdPreview(path, info) {
    let html;
    try { html = mdToSafeHtml(info.text); }
    catch (err) { console.warn('Markdown 預覽失敗，改顯示原始碼:', err); notify('Markdown 預覽失敗，改顯示原始碼。', true); return false; }
    state.view = null;
    state.mdActive = true;
    state.mdPath = path;
    state.mdHtml = html;
    metaText.textContent = LANG_LABEL.md + ' · 預覽 · ' + fmtSize(info.size);
    viewer.innerHTML = '<article class="md"></article>';
    viewer.scrollTop = 0;
    viewer.scrollLeft = 0;
    paintMd();
    return true;
  }

  VIEW_KINDS.md = { label: '預覽', title: '切換成渲染後的預覽', detect: info => info.lang === 'md' && libOk('marked') && libOk('DOMPurify'), render: renderMdPreview };

  viewer.addEventListener('click', e => {
    if (!state.mdActive) return;
    const load = e.target.closest('.md-load-remote');
    if (load) { state.mdRemoteFor = state.mdPath; paintMd(); return; }
    const a = e.target.closest('.md a');
    if (!a) return;
    if (a.hasAttribute('data-open')) { e.preventDefault(); previewFile(a.getAttribute('data-open')); return; }
    if (a.hasAttribute('data-anchor')) {
      e.preventDefault();
      let id = a.getAttribute('data-anchor');
      try { id = decodeURIComponent(id); } catch (_) {}
      const root = viewer.querySelector('.md');
      const find = v => root.querySelector('[id="' + String(v).replace(/"/g, '\\"') + '"]');
      const target = find('md-' + id) || find('md-' + id.toLowerCase());
      if (target) target.scrollIntoView({ block: 'start' });
      return;
    }
    if (!a.hasAttribute('target')) e.preventDefault();   // 其他沒有實際目標的連結不要讓頁面跳走
  });

  /* ===================== 各類型檔案的專屬檢視：日誌 / CSV / JSON 樹狀 / 圖片 / PDF / SVG ===================== */
  const viewBar = $('viewBar');
  const MEDIA_EXT = { png: 'image', jpg: 'image', jpeg: 'image', gif: 'image', webp: 'image', bmp: 'image', ico: 'image', avif: 'image', pdf: 'pdf' };
  AV_AUDIO_EXT.forEach(e => { MEDIA_EXT[e] = 'audio'; });
  AV_VIDEO_EXT.forEach(e => { MEDIA_EXT[e] = 'video'; });
  const elx = (tag, cls, text) => { const e = document.createElement(tag); if (cls) e.className = cls; if (text !== undefined) e.textContent = text; return e; };

  async function copyText(text) {
    try { await navigator.clipboard.writeText(text); return true; } catch (_) {}
    const ta = document.createElement('textarea');
    ta.value = text;
    ta.style.cssText = 'position:fixed;opacity:0';
    document.body.append(ta);
    ta.select();
    let ok = false;
    try { ok = document.execCommand('copy'); } catch (_) {}
    ta.remove();
    return ok;
  }
  const flash = (btn, ok, label) => { const t = btn.textContent; btn.textContent = ok ? '已複製' : '複製失敗'; setTimeout(() => { btn.textContent = label || t; }, 1200); };

  /* ---------- 日誌：依等級與文字篩選 ---------- */
  const LOG_GROUPS = [
    ['error', 'ERROR', c => c >= 5, 'lg-error'],
    ['warn', 'WARN', c => c === 4, 'lg-warn'],
    ['info', 'INFO', c => c === 3, ''],
    ['debug', 'DEBUG', c => c === 2, 'lg-dim'],
    ['trace', 'TRACE', c => c === 1, 'lg-dim'],
    ['none', '其他', c => c === 0, '']
  ];
  state.logFilters = new Map();   // 檔案 -> { off:停用的等級, q:文字 }
  const logFilter = path => {
    let f = state.logFilters.get(path);
    if (!f) { f = { off: new Set(), q: '' }; state.logFilters.set(path, f); }
    return f;
  };

  function applyLogFilter(v) {
    const f = logFilter(v.path);
    const terms = f.q.toLowerCase().split(/\s+/).filter(Boolean);
    if (!f.off.size && !terms.length) { v.rows = null; v.rowsTruncated = false; return; }
    const hidden = LOG_GROUPS.filter(g => f.off.has(g[0])).map(g => g[2]);
    const rows = [];
    for (let i = 0; i < v.levels.length; i++) {
      if (hidden.some(fn => fn(v.levels[i]))) continue;
      if (terms.length) { const t = v.raw[i].toLowerCase(); if (!terms.every(x => t.includes(x))) continue; }
      rows.push(i);
    }
    v.rows = rows;
    v.rowsTruncated = rows.length > WRAP_MAX_LINES;
    if (v.rowsTruncated) v.rows = rows.slice(0, WRAP_MAX_LINES);
  }

  CODE_EXT.prepare.push(v => {
    if (v.lang !== 'log' || !v.raw) return;
    v.levels = logLevels(v.raw);
    applyLogFilter(v);
  });
  CODE_EXT.mount.push(v => { if (v.lang === 'log' && v.levels) mountLogBar(v); });

  function refilterLog(v) {
    applyLogFilter(v);
    v.layout = v.wrap || v.rows ? 'rows' : 'pre';
    buildShell(v);
    paintBody();
    updateLogStat(v);
  }
  function updateLogStat(v) {
    const s = viewBar.querySelector('.lgstat');
    if (s) s.textContent = '顯示 ' + (v.rows ? v.rows.length : v.lines.length) + ' / ' + v.lines.length + ' 行';
  }

  function jumpLogError(v, dir) {
    const visible = v.rows ? new Set(v.rows) : null;
    const errs = [];
    for (let i = 0; i < v.levels.length; i++) if (v.levels[i] >= 5 && (!visible || visible.has(i))) errs.push(i);
    if (!errs.length) { notify('目前沒有可跳的 ERROR / FATAL 行。'); return; }
    const cur = FS.curLine && FS.curLine.path === v.path ? FS.curLine.line : topLine();
    let target = dir > 0 ? errs.find(i => i > cur) : [...errs].reverse().find(i => i < cur);
    if (target === undefined) target = dir > 0 ? errs[0] : errs[errs.length - 1];   // 繞回另一端
    FS.curLine = { path: v.path, line: target };
    placeCurLine();
    scrollToLine(target);
  }

  function mountLogBar(v) {
    const f = logFilter(v.path);
    const counts = LOG_GROUPS.map(() => 0);
    for (let i = 0; i < v.levels.length; i++) counts[LOG_GROUPS.findIndex(g => g[2](v.levels[i]))]++;
    viewBar.hidden = false;
    viewBar.className = 'viewbar logbar';
    viewBar.textContent = '';
    const chips = elx('span', 'chips');
    LOG_GROUPS.forEach((g, gi) => {
      const b = elx('button', 'chip' + (f.off.has(g[0]) ? '' : ' on') + (g[3] ? ' ' + g[3] : ''), g[1] + ' ' + counts[gi]);
      b.type = 'button';
      b.title = '顯示 / 隱藏 ' + g[1];
      b.addEventListener('click', () => {
        if (f.off.has(g[0])) f.off.delete(g[0]); else f.off.add(g[0]);
        b.classList.toggle('on', !f.off.has(g[0]));
        refilterLog(v);
      });
      chips.append(b);
    });
    const q = elx('input', 'fs-input logq');
    q.placeholder = '篩選文字（空白分隔多個詞，需全部出現）';
    q.value = f.q;
    q.spellcheck = false;
    let timer = null;
    q.addEventListener('input', () => { clearTimeout(timer); timer = setTimeout(() => { f.q = q.value; refilterLog(v); }, 200); });
    const prev = elx('button', 'btn', '▲ 上個錯誤'), next = elx('button', 'btn', '▼ 下個錯誤');
    prev.type = next.type = 'button';
    prev.addEventListener('click', () => jumpLogError(v, -1));
    next.addEventListener('click', () => jumpLogError(v, 1));
    const clear = elx('button', 'btn', '清除篩選');
    clear.type = 'button';
    clear.addEventListener('click', () => { f.off.clear(); f.q = ''; mountLogBar(v); refilterLog(v); });
    viewBar.append(chips, q, prev, next, clear, elx('span', 'lgstat nb-muted'));
    updateLogStat(v);
  }

  /* ---------- CSV / TSV：表格 ---------- */
  const CSV_MAX_ROWS = 2000;
  const csvNum = v => v !== '' && v.trim() !== '' && isFinite(Number(v));

  function renderCsv(path, info) {
    if (info.text.length > 20 * 1024 * 1024) { notify('CSV 超過 20 MB，不產生表格，改顯示原始碼。', true); return false; }
    const st = { delim: csvDetect(info.text), header: true, q: '', sort: null };
    let rows = csvParse(info.text, st.delim);
    if (!rows.length) return false;

    const root = elx('div', 'csvv');
    const bar = elx('div', 'csvbar');
    const q = elx('input', 'fs-input csvq');
    q.placeholder = '篩選（空白分隔多個詞，需全部出現）';
    q.spellcheck = false;
    const dsel = elx('select', 'nb-sel');
    [[',', '逗號 ,'], ['\t', 'Tab'], [';', '分號 ;'], ['|', '直線 |']].forEach(([v, l]) => { const o = elx('option', '', l); o.value = v; dsel.append(o); });
    dsel.value = st.delim;
    const hcb = elx('input'); hcb.type = 'checkbox'; hcb.checked = true;
    const hl = elx('label', 'csvh'); hl.append(hcb, document.createTextNode(' 第一列是標題'));
    const stat = elx('span', 'csvstat nb-muted');
    const dl = elx('label'); dl.append(document.createTextNode('分隔 '), dsel);
    bar.append(q, dl, hl, stat);
    const wrap = elx('div', 'csvwrap');
    wrap.tabIndex = 0;
    const table = elx('table', 'csvt');
    wrap.append(table);
    root.append(bar, wrap);

    const draw = () => {
      const ncol = Math.max(1, ...rows.slice(0, 5000).map(r => r.length));
      const head = st.header ? rows[0] : null;
      const data = st.header ? rows.slice(1) : rows;
      let idx = data.map((_, i) => i);
      const terms = st.q.toLowerCase().split(/\s+/).filter(Boolean);
      if (terms.length) idx = idx.filter(i => { const t = data[i].join('\u0001').toLowerCase(); return terms.every(x => t.includes(x)); });
      if (st.sort) {
        const { col, dir } = st.sort;
        idx.sort((a, b) => {
          const x = data[a][col] || '', y = data[b][col] || '';
          const c = csvNum(x) && csvNum(y) ? Number(x) - Number(y) : x.localeCompare(y, undefined, { numeric: true, sensitivity: 'base' });
          return c * dir || a - b;
        });
      }
      const numCol = [];
      for (let c = 0; c < ncol; c++) {
        const vals = data.slice(0, 200).map(r => r[c] || '').filter(x => x !== '');
        numCol[c] = vals.length > 0 && vals.filter(csvNum).length / vals.length >= 0.8;
      }
      let html = '<thead><tr><th class="rn">#</th>';
      for (let c = 0; c < ncol; c++) {
        const label = head ? (head[c] || '') : '欄 ' + (c + 1);
        const arrow = st.sort && st.sort.col === c ? (st.sort.dir > 0 ? ' ▲' : ' ▼') : '';
        html += '<th class="sortable' + (numCol[c] ? ' num' : '') + '" data-c="' + c + '" title="按一下排序">' + esc(label) + '<span class="si">' + arrow + '</span></th>';
      }
      html += '</tr></thead><tbody>';
      const shown = idx.slice(0, CSV_MAX_ROWS);
      for (const i of shown) {
        html += '<tr><td class="rn">' + (i + 1) + '</td>';
        const r = data[i];
        for (let c = 0; c < ncol; c++) {
          const v = r[c] === undefined ? '' : r[c];
          html += '<td' + (numCol[c] ? ' class="num"' : '') + (v.length > 40 ? ' title="' + mdAttr(v.slice(0, 600)) + '"' : '') + '>' + esc(v) + '</td>';
        }
        html += '</tr>';
      }
      table.innerHTML = html + '</tbody>';
      stat.textContent = '共 ' + data.length + ' 列 × ' + ncol + ' 欄' + (terms.length ? ' · 符合 ' + idx.length + ' 列' : '') +
        (idx.length > CSV_MAX_ROWS ? ' · 只顯示前 ' + CSV_MAX_ROWS + ' 列' : '');
    };

    table.addEventListener('click', e => {
      const th = e.target.closest('th.sortable');
      if (!th) return;
      const col = +th.dataset.c;
      if (!st.sort || st.sort.col !== col) st.sort = { col, dir: 1 };
      else if (st.sort.dir === 1) st.sort = { col, dir: -1 };
      else st.sort = null;
      draw();
    });
    let timer = null;
    q.addEventListener('input', () => { clearTimeout(timer); timer = setTimeout(() => { st.q = q.value; draw(); }, 180); });
    hcb.addEventListener('change', () => { st.header = hcb.checked; st.sort = null; draw(); });
    dsel.addEventListener('change', () => { st.delim = dsel.value; rows = csvParse(info.text, st.delim); st.sort = null; draw(); });

    viewer.textContent = '';
    viewer.append(root);
    viewer.scrollTop = 0;
    viewer.scrollLeft = 0;
    metaText.textContent = 'CSV · 表格 · ' + fmtSize(info.size);
    draw();
    return true;
  }
  VIEW_KINDS.csv = { label: '表格', title: '切換成表格檢視（可排序、篩選）', detect: info => info.lang === 'csv', render: renderCsv };

  /* ---------- JSON：樹狀 ---------- */
  const jsonKeyOk = k => /^[A-Za-z_$][\w$]*$/.test(k);
  const jsonPath = arr => arr.map((k, i) => (typeof k === 'number' ? '[' + k + ']' : jsonKeyOk(k) ? (i ? '.' : '') + k : '[' + JSON.stringify(k) + ']')).join('');
  const jqPath = arr => {
    if (!arr.length) return '.';
    const s = arr.map(k => (typeof k === 'number' ? '[' + k + ']' : /^[A-Za-z_]\w*$/.test(k) ? '.' + k : '[' + JSON.stringify(k) + ']')).join('');
    return s[0] === '[' ? '.' + s : s;
  };
  const jsonType = v => (v === null ? 'null' : Array.isArray(v) ? 'array' : typeof v);

  function renderJsonTree(path, info) {
    if (info.text.length > 30 * 1024 * 1024) { notify('JSON 超過 30 MB，不產生樹狀檢視，改顯示原始碼。', true); return false; }
    let data;
    try { data = JSON.parse(info.text); }
    catch (err) { notify('JSON 語法錯誤，改顯示原始碼：' + err.message, true); return false; }

    const st = { depth: 2, q: '' };
    const root = elx('div', 'jsonv');
    const bar = elx('div', 'jbar');
    const mkBtn = (label, fn, title) => { const b = elx('button', 'btn', label); b.type = 'button'; if (title) b.title = title; b.addEventListener('click', fn); return b; };
    const q = elx('input', 'fs-input jq');
    q.placeholder = '搜尋鍵名或值';
    q.spellcheck = false;
    const stat = elx('span', 'nb-muted jstat');
    const sel = elx('div', 'jsel');
    const selPath = elx('span', 'jpath nb-muted', '點一下節點可複製路徑或值');
    const cpPath = mkBtn('複製路徑', async e => flash(e.target, await copyText(selected ? jsonPath(selected._p) : '')));
    const cpJq = mkBtn('複製 jq', async e => flash(e.target, await copyText(selected ? jqPath(selected._p) : '.')));
    const cpVal = mkBtn('複製值', async e => { const v = selected ? selected._v : data; flash(e.target, await copyText(typeof v === 'string' ? v : JSON.stringify(v, null, 2).slice(0, 2000000))); });
    [cpPath, cpJq, cpVal].forEach(b => { b.disabled = true; });
    sel.append(selPath, cpPath, cpJq, cpVal);
    bar.append(
      mkBtn('1 層', () => setDepth(1)), mkBtn('2 層', () => setDepth(2)), mkBtn('3 層', () => setDepth(3)),
      mkBtn('全部展開', () => setDepth(Infinity)), mkBtn('收合', () => setDepth(0)), q, stat);
    const tree = elx('div', 'jtree');
    tree.tabIndex = 0;
    root.append(bar, sel, tree);

    let selected = null, qs = '';
    const pk = arr => JSON.stringify(arr);
    const hi = text => {
      if (!qs) return esc(text);
      const lo = text.toLowerCase();
      let out = '', pos = 0, i;
      while ((i = lo.indexOf(qs, pos)) !== -1) { out += esc(text.slice(pos, i)) + '<mark class="hit">' + esc(text.slice(i, i + qs.length)) + '</mark>'; pos = i + qs.length; }
      return out + esc(text.slice(pos));
    };
